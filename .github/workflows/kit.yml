# Harness kit self-tests: the generic grader (both directions) and case generation with its scripted
# controls, for every role that has a spec and a fixture. No model calls, no secrets.
name: kit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install
        working-directory: packages/pit-wall
        run: npm ci
      - name: grader self-test
        working-directory: packages/pit-wall
        run: node --test test/kit-grader.test.mjs
      - name: generate cases and check scripted controls for every role
        run: |
          set -e
          for spec in kit/roles/*.yaml; do
            role=$(basename "$spec" .yaml)
            for fx in kit/fixtures/*/; do
              if grep -q "^role: $role$" "$fx/fixture.yaml"; then
                node packages/pit-wall/src/kit/gen-cases.mjs "$spec" "$fx" "$RUNNER_TEMP/cases-$role"
              fi
            done
          done
