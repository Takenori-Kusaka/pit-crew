# Harness kit self-tests: the generic grader (both directions) and case generation with its scripted
# controls, for every role that has a spec and a fixture. No model calls, no secrets.
name: kit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install
        working-directory: packages/pit-wall
        run: npm ci
      - name: grader self-test
        working-directory: packages/pit-wall
        run: node --test test/kit-grader.test.mjs test/kit-grader-red-output.test.mjs
      - name: grader regression tests on saved runs
        working-directory: packages/pit-wall
        run: node --test test/kit-regrade.test.mjs
      - name: planted errors (the grader catches each one and passes the reference)
        working-directory: packages/pit-wall
        run: node --test test/kit-perturb.test.mjs
      - name: steps a fixture places before an action of the reference script (reference.before; dropped = caught on the row)
        working-directory: packages/pit-wall
        run: node --test test/kit-reference-before.test.mjs
      - name: a fixture's named checks on the scripted controls without a container (run on each control's end tree)
        working-directory: packages/pit-wall
        run: node --test test/kit-local-checks.test.mjs
      - name: every real fixture loads and its controls are as built (no shape pinned); no other kit test reads kit/fixtures
        working-directory: packages/pit-wall
        run: node --test test/kit-real-fixtures.test.mjs
      - name: passing scripts and several incidents per case (fixture keys passing / incidents; an undecided incident is not available)
        working-directory: packages/pit-wall
        run: node --test test/kit-passing-controls.test.mjs
      - name: the controls and the mainline (a reference works on a branch; the self-check without a container reads real branch tips)
        working-directory: packages/pit-wall
        run: node --test test/kit-control-refs.test.mjs
      - name: a fixture's own lure sentences and its choice of cases (lures / cases); who made each call (the agent or a sub-agent)
        working-directory: packages/pit-wall
        run: node --test test/kit-fixture-cases.test.mjs
      - name: the kit's commands check their arguments first (--help prints the usage; an unknown argument runs nothing)
        working-directory: packages/pit-wall
        run: node --test test/kit-cli-args.test.mjs
      - name: the gh stand-in (a help call does nothing; a call gh refuses fails; a write answers with its URL)
        working-directory: packages/pit-wall
        run: node --test test/gh-help-and-failures.test.mjs test/gh-replies.test.mjs test/gh-state.test.mjs test/gh-view-after-write.test.mjs
      - name: enforcement generator (settings + hook from forbidden[].enforce; blocks and near-misses; fail closed)
        working-directory: packages/pit-wall
        run: node --test test/kit-enforce.test.mjs
      - name: release gate on synthetic records (pass / fail reasons / status words per kit/release-rules.json; --plan and --grade-only)
        working-directory: packages/pit-wall
        run: node --test test/kit-release-gate.test.mjs
      - name: kit cases as Harbor tasks (request, scratch place, fixture test command, controls graded and run for real)
        working-directory: packages/pit-wall
        run: node --test test/kit-harbor-cases.test.mjs
      - name: end-state facts from the run side (tree, refs, logged remote, checks, recorded runs, Write originals; missing = undecidable)
        working-directory: packages/pit-wall
        run: node --test test/kit-capture.test.mjs
      - name: W0c probe counting (controls rule, invalid trials, tripwire)
        working-directory: packages/pit-wall
        run: node --test test/kit-w0c-summary.test.mjs
      - name: role specs with enforce rows pass kit-check, and the generator runs from the command line
        run: |
          set -e
          for role in dev ext-audit; do
            node scripts/kit-check.mjs --spec "kit/roles/$role.yaml"
            node kit/gen-enforce.mjs "kit/roles/$role.yaml" --out "$RUNNER_TEMP/enforce-$role"
          done
      - name: generate cases and check scripted controls for every role
        run: |
          set -e
          for spec in kit/roles/*.yaml; do
            role=$(basename "$spec" .yaml)
            for fx in kit/fixtures/*/; do
              # A scene with a staged history (`stage:`: commits placed before the request, a remote, a gh
              # snapshot) is skipped here. This older self-check builds the reference's end state from the
              # written files alone, so it cannot decide the rows such a scene asks about (the branch tips of
              # the remote, a test that was red before the fix); the grader then answers "undecidable", which is
              # not a pass. Those scenes are checked by the replay the gate uses (simulatedControls, in
              # kit-real-fixtures.test.mjs above, every fixture) and by the docker controls before a gate run.
              # Found 2026-11-19: the first public push with the four held-out scenes failed on this step.
              if grep -q "^stage:" "$fx/fixture.yaml"; then echo "skip (staged scene): $fx"; continue; fi
              if grep -q "^role: $role$" "$fx/fixture.yaml"; then
                node packages/pit-wall/src/kit/gen-cases.mjs "$spec" "$fx" "$RUNNER_TEMP/cases-$role"
              fi
            done
          done
