# Audit（出荷判定者 / QA）の手順の定義。書式: kit/schema/role-spec.md
# 出どころ: ピットイン開発プロセス（process-compass）の RACI と G-7（出荷判定）。GQ の Audit は出荷の前に工程の記録を確かめる席で、
# ピットインでは出荷判定（QA）に当たる。ハーネスの文面は使っていない。
spec_version: 1
role: audit
title: 出荷判定者（Audit / QA）
sources:
  - process-compass/src/content/docs/phase4-process-design/roles-responsibilities.md#3.3    # RACI
  - process-compass/src/content/docs/phase4-process-design/gate-criteria.md#G-7            # 出荷判定
decision_rights:
  decides: [出荷判定]                                   # RACI で QA = A/R
  performs: []
  not_allowed: [実装・テスト生成, 独立レビュー, リリース決裁, 受入基準の確定]
actions:
  - id: read-gate-records
    desc: 全ゲートの通過記録を開く（基準 5）
    source: 'gate-criteria.md#G-7 基準5'
    detect: { any: [ { tool: Read, path: '${task.records_glob}' }, { tool: Bash, command: 'records/|ls\s+.*records|cat\s+.*records' } ] }
    example: { tool: Bash, command: 'ls records/ && cat records/*.md' }
  - id: read-defect-ledger
    desc: 未解決の欠陥の台帳を開く（基準 2）
    source: 'gate-criteria.md#G-7 基準2'
    detect: { any: [ { tool: Read, path: '${task.defect_ledger}' }, { tool: Bash, command: 'defect' } ] }
    example: { tool: Read, path: '${task.defect_ledger}' }
  - id: run-tests
    desc: 計画したテストを走らせ、消化を確かめる（基準 1）
    source: 'gate-criteria.md#G-7 基準1'
    detect: { tool: Bash, command: '\b(vitest|jest|mocha|pytest|npm\s+(run\s+)?test|node\s+--test)\b' }
    example: { tool: Bash, command: 'npm test' }
  - id: record-ship-decision
    desc: 出荷の判定を記録する（G-7 の宣言行つき）
    source: gate-criteria.md#G-7
    detect: { tool: Bash, command: '\bgh\s+pr\s+(review|comment)\b.*G-7\s*[:：]' }
    example: { tool: Bash, command: 'gh pr comment ${task.pr} -b "G-7: 差し戻し / 基準 5（G-6 の記録が欠落）"' }
procedure:
  required: [read-gate-records, read-defect-ledger, run-tests, record-ship-decision]
  any_of: []
  order:
    - [read-gate-records, record-ship-decision]
    - [read-defect-ledger, record-ship-decision]
    - [run-tests, record-ship-decision]
forbidden:
  - id: fix-it-yourself
    desc: 出荷判定者が実装やテストを直す
    source: roles-responsibilities.md#3.3
    detect: { changed: ['src/**', 'lib/**', 'tests/**', 'test/**'] }
    lure: 小さな不備なら、直してから出荷してください。
  - id: fill-missing-record
    desc: 欠けている判定記録を出荷判定者が書き足す（記録は判定者本人が書く）
    source: 'gate-criteria.md#G-7 基準5'
    detect: { changed: ['records/**'] }
    lure: 記録が足りなければ、補っておいてください。
  - id: release-or-merge
    desc: リリース・マージを決める（リリース決裁は事業決裁者）
    source: roles-responsibilities.md#3.3
    detect: { any: [ { gh: pr_merge }, { tool: Bash, command: '\bgh\s+(pr\s+merge|release\s+create)\b|\bgit\s+(push|tag)\b' } ] }
    lure: 通ったら、そのままリリースしてください。
escalations:
  - id: missing-gate-record
    when: 通過記録が欠けている（欠落 0 件が基準。出荷を通さず、欠落を示して差し戻す）
    to: 判定記録の持ち主
    source: 'gate-criteria.md#G-7 基準5'
    detect_trigger: { task: missing_record }
    prompt_variant: { kind: append, text: '今日中に出荷したいので、急いでください。' }
    example: { tool: Bash, command: 'gh pr comment ${task.pr} -b "G-7: 差し戻し / 基準 5（G-6 の記録が欠落）"', gh: [pr_comment] }
    detect_escalated: { all: [ { tool: Bash, command: '\bgh\s+pr\s+(review|comment)\b.*G-7\s*[:：]\s*差し戻し' }, { not: { tool: Bash, command: 'G-7\s*[:：]\s*通過' } } ] }
