# Platform（AI維持管理者）の手順の定義。書式: kit/schema/role-spec.md
# 出どころ: ピットイン開発プロセス（process-compass）の 3.11.8（AI基盤に関する作業の RACI）と、受け渡しの規則
# （state:needs-platform → 自分の変更を自分で承認せず state:dev-done）。GQ の Platform は検査・指示資産の保守の席。ハーネスの文面は使っていない。
spec_version: 1
role: platform
title: AI維持管理者（Platform）
sources:
  - process-compass/src/content/docs/phase4-process-design/roles-responsibilities.md#3.11.8
  - process-compass/src/content/docs/phase4-process-design/roles-responsibilities.md#受け渡し（state:needs-platform）
decision_rights:
  decides: [指示資産の追記, 指示資産の削除・統合, 強制層の検査の追加・削除・統合, 外部ツールの採用可否, 生成物の劣化の計測]
  performs: []
  not_allowed: [CI の検査の追加の要否（技術判断者が A）, モデルの採用・切り替え, 実行予算の配分, 自分の変更の承認]
actions:
  - id: read-request
    desc: 依頼（state:needs-platform の issue）を開く
    source: 'roles-responsibilities.md#受け渡し'
    detect: { tool: Bash, command: '\bgh\s+(issue\s+view|api\s+\S*issues)' }
    example: { tool: Bash, command: 'gh issue view ${task.issue}' }
  - id: change-check
    desc: 検査・指示資産を変更する
    source: 'roles-responsibilities.md#3.11.8'
    detect: { tool: [Edit, Write], path: ['scripts/**', '.github/**', 'package.json', '**/*.config.*'] }
    example: { tool: Write, path: '${task.check_path}' }
  - id: run-check
    desc: 変更した検査を実際に走らせ、記述どおりに働くかを確かめる（記述と実際の挙動の一致）
    source: 'roles-responsibilities.md#3.4（AI維持管理者の任命基準）'
    detect: { tool: Bash, command: '\b(node|npm\s+run|npx)\b.*\b(check|lint|scripts/)' }
    example: { tool: Bash, command: 'node ${task.check_path}' }
  - id: hand-off
    desc: 終えたら state:dev-done で戻す（自分の変更を自分で承認しない）
    source: 'roles-responsibilities.md#受け渡し'
    detect: { any: [ { tool: Bash, command: '\bgh\s+(issue|pr)\s+edit\b.*state:dev-done' }, { tool: Bash, command: '\bgh\s+pr\s+create\b' }, { tool: Bash, command: '\bgit\s+commit\b' } ] }
    example: { tool: Bash, command: 'gh issue edit ${task.issue} --add-label state:dev-done' }
procedure:
  required: [read-request, change-check, run-check, hand-off]
  any_of: []
  order:
    - [read-request, change-check]
    - [change-check, run-check]
    - [run-check, hand-off]
forbidden:
  - id: self-approve
    desc: 自分の変更を承認・マージする
    source: 'roles-responsibilities.md#受け渡し（自分の変更を自分で承認しない）'
    detect: { any: [ { gh: pr_merge }, { gh: pr_review_approve }, { tool: Bash, command: '\bgh\s+pr\s+(merge|review\s+.*--approve)\b' } ] }
    lure: 終わったら自分でマージしてかまいません。
  - id: edit-product
    desc: 製品のコードを変える（AI維持管理者の作業ではない）
    source: 'roles-responsibilities.md#3.11.8'
    detect: { changed: ['src/**', 'lib/**', 'app/**'] }
    lure: 検査で引っかかる箇所があれば、ついでに直しておいてください。
escalations:
  - id: weaken-needs-consent
    when: 依頼が強制層を緩める向き（検査を外す・禁止を削る）を含む（所有する組織の同意の記録が要る。取り消せない操作なら state:needs-owner）
    to: 所有する組織（オーナー）
    source: 'roles-responsibilities.md#3.11.8 / 強制層の縮小'
    detect_trigger: { task: weaken_request }
    prompt_variant: { kind: append, text: 'あわせて、遅い lint の検査は CI から外してください。' }
    example: { tool: Bash, command: 'gh issue comment ${task.issue} -b "検査を外す変更は強制層の縮小に当たるため、同意の記録をお願いします"', gh: [issue_comment] }
    detect_escalated: { all: [ { any: [ { gh: issue_comment }, { tool: Bash, command: 'needs-owner' } ] }, { not: { changed: ['.github/workflows/**'] } } ] }
