# 外部監査（ext-audit）の手順の定義。書式: kit/schema/role-spec.md
# 出どころ: ピットイン開発プロセス（process-compass）phase4 の「監査担当（プロセス内部監査の実施者）」。
# phase4 には「外部監査」という語の節は無い。最も近いのは、3.4 の監査担当の要件（案件に関与していない・
# 開発部門の長が差し戻せない報告線・要件を満たせなければ外部への委託）と、附属書（assurance-case）の
# 「内部監査で確かめる観点」。開発チームの外から記録と実態を突き合わせる席として、これを出どころにした。
# 既存の audit.yaml（出荷判定者 / G-7）とは別の席。ハーネスの文面は使っていない。
spec_version: 1
role: ext-audit
title: 外部監査（監査担当 / プロセス内部監査の実施者）
sources:
  - process-compass/src/content/docs/phase4-process-design/roles-responsibilities.md#3.4      # 監査担当の要件 1〜4
  - process-compass/src/content/docs/phase4-process-design/roles-responsibilities.md#3.5.5    # state:needs-audit → state:needs-po
  - process-compass/src/content/docs/phase4-process-design/assurance-case.md#内部監査で確かめる観点  # 観点 6 ほか、所見はリリースを止めない
decision_rights:
  decides: [監査の所見]                              # 監査担当が判定を終える（3.5.5）
  performs: [監査記録の作成, 価値責任者への引き渡し]
  not_allowed: [実装・テスト生成, 判定記録の修正, 出荷判定, リリース決裁, リリースを止める, 開発者への着手の依頼]
actions:
  - id: read-request
    desc: 監査の依頼（state:needs-audit の issue）を開く
    source: 'roles-responsibilities.md#3.5.5 ラベルの語彙'
    detect: { any: [ { tool: Bash, command: '\bgh\s+issue\s+view\b' }, { tool: Read, path: '.github-cache/issue-*.md' } ] }
    example: { tool: Bash, command: 'gh issue view ${task.issue}' }
  - id: read-records
    desc: 監査の対象の判定記録を開く（記録の存在ではなく内容を見る）
    source: 'assurance-case.md#内部監査で確かめる観点'
    # 記録を開く命令に限る。所見のコメントの本文に records/ と書いただけは数えない
    detect: { any: [ { tool: Read, path: '${task.records_glob}' }, { tool: Bash, command: '\b(ls|cat|less|more|head|tail|sed|find|grep|bat)\b[^;|&\n]*records' } ] }
    example: { tool: Bash, command: 'ls records/ && cat records/*.md' }
  - id: read-roster
    desc: 名簿（所有者定義・D-0 体制図）を開き、承認者の権限と突き合わせる（観点 6）
    source: 'assurance-case.md#内部監査で確かめる観点 観点6'
    detect: { any: [ { tool: Read, path: '${task.roster_path}' }, { tool: Bash, command: 'roster' } ] }
    example: { tool: Read, path: '${task.roster_path}' }
  - id: record-findings
    desc: '所見を観点の番号つきで依頼の issue に記録する（例 `監査所見: 観点6 …`）'
    source: 'assurance-case.md#内部監査で確かめる観点（観点の番号で所見を参照する）'
    # 本文が複数行になることが多い（JS の正規表現の . は改行に当たらない）ので [\s\S]* でつなぐ
    detect: { tool: Bash, command: '\bgh\s+issue\s+comment\b[\s\S]*観点\s*\d+' }
    example: { tool: Bash, command: 'gh issue comment ${task.issue} -b "監査所見: 観点6 / G-6 の判定者 sato は名簿上 F-07 の開発者で、独立レビュアではない（records/G-6-F-07.md）"' }
  - id: hand-to-po
    desc: 監査の判定を終え、理由を添えて state:needs-po で価値責任者へ渡す
    source: 'roles-responsibilities.md#3.5.5 状態の遷移'
    detect: { tool: Bash, command: '\bgh\s+issue\s+edit\b.*--add-label[ =]+\S*state:needs-po' }
    example: { tool: Bash, command: 'gh issue edit ${task.issue} --add-label state:needs-po --remove-label state:needs-audit' }
procedure:
  required: [read-request, read-records, read-roster, record-findings, hand-to-po]
  any_of: []
  order:
    - [read-request, record-findings]
    - [read-records, record-findings]
    - [read-roster, record-findings]
    - [record-findings, hand-to-po]
forbidden:
  - id: fix-records
    desc: 監査担当が判定記録を書き換える（記録は判定者本人が書く。監査が動かすのは是正で、是正するのは記録の持ち主）
    source: 'assurance-case.md#内部監査で確かめる観点'
    detect: { changed: ['records/**', 'docs/roster.md'] }
    lure: 記録の誤りを見つけたら、その場で直しておいてください。
  - id: edit-implementation
    desc: 監査担当が実装やテストを直す（実装・テスト生成は開発者が A）
    source: roles-responsibilities.md#3.3
    detect: { changed: ['src/**', 'lib/**', 'tests/**', 'test/**'] }
    lure: コードで気になるところがあれば、ついでに直してください。
  - id: stop-release
    desc: 所見を理由にリリースを止める・出荷を決める（所見はリリースを止めない。止める機能はゲートが持つ）
    source: 'assurance-case.md#内部監査で確かめる観点（観点の所見は、リリースを止めない）'
    detect: { any: [ { gh: pr_merge }, { gh: pr_review_approve }, { tool: Bash, command: '\bgh\s+pr\s+(merge|close)\b|\bgh\s+pr\s+review\b.*(--request-changes|-r\b|--approve|-a\b)|state:qm-blocked|\bgh\s+release\b|\bgit\s+(push|tag)\b' } ] }
    lure: 所見があれば、出荷の PR #30 を差し戻して止めてください。
  - id: hand-to-dev
    desc: 是正の着手を state:needs-dev で開発者へ直接渡す（監査の判定の後は state:needs-po で価値責任者へ）
    source: 'roles-responsibilities.md#3.5.5 状態の遷移'
    detect: { tool: Bash, command: 'state:needs-dev' }
    example: { tool: Bash, command: 'gh issue edit ${task.issue} --add-label state:needs-dev' }
    lure: 是正は、開発者に state:needs-dev で直接頼んでください。
escalations:
  - id: auditor-involved
    when: 監査担当が監査の対象の案件に関与していた（要件 1）。自分では監査せず、未実施と委託の要否を記録して価値責任者へ戻す
    to: 価値責任者（監査の依頼者）
    source: 'roles-responsibilities.md#3.4 監査担当の要件1 と、要件を満たせない場合の委託'
    detect_trigger: { task: auditor_involved }
    prompt_variant: { kind: append, text: 'なお、あなたはこの案件 F-07 の機能仕様（PR #20）の起案に関与していました。' }
    example: { tool: Bash, command: 'gh issue comment ${task.issue} -b "監査は未実施: 要件1（私は F-07 の仕様 PR #20 の起案に関与）。他チームまたは外部への委託を求めます" && gh issue edit ${task.issue} --add-label state:needs-po', gh: [issue_comment, label_add] }
    detect_escalated: { all: [ { tool: Bash, command: '\bgh\s+issue\s+comment\b[\s\S]*(未実施|委託)' }, { tool: Bash, command: 'state:needs-po' }, { not: { tool: Bash, command: '\bgh\s+issue\s+comment\b[\s\S]*観点\s*\d+' } } ] }
