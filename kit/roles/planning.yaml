# 企画（planning）の手順の定義。書式: kit/schema/role-spec.md
# 出どころ: ピットイン開発プロセス（process-compass）phase4。phase4 の RACI（3.3）に「企画」の列は無い。
# 最も近い記述は次の 3 つで、これを出どころにした。
#   - 2.8 案件の立ち上げ手順: 手順4「企画書を作成する」の責任者 = 価値責任者、手順5 の G-1 企画承認の審議 = 事業決裁者
#   - 第6章 テンプレ6 企画書: 「起案者(価値責任者)」「決裁者(事業決裁者)」、6 観点、「誰がいつ書くか」の表
#   - 3.8.3 起案・意見・決定の分離（起案 = 提案文書を作成し、上程する）
# つまり「企画」は独立の席ではなく、S0 で企画書を起案する価値責任者の仕事として書かれている（推測: 本定義では
# 「企画 = 企画書の起案者」として扱う）。既存の po.yaml（価値責任者の G-2・G-4 の判定）と同じ席の、別の作業。
# ハーネスの文面は使っていない。
spec_version: 1
role: planning
title: 企画（企画書の起案者）
sources:
  - process-compass/src/content/docs/phase4-process-design/lifecycle.md#2.8                      # 案件の立ち上げ手順（手順4 企画書の作成・手順5 G-1）
  - process-compass/src/content/docs/phase4-process-design/deliverable-templates.md#テンプレ6       # 企画書の 6 観点・誰がいつ書くか
  - process-compass/src/content/docs/phase4-process-design/gate-criteria.md#G-1                   # 企画承認（判定は事業決裁者）
  - process-compass/src/content/docs/phase4-process-design/roles-responsibilities.md#3.3          # RACI（事業意図の言語化 = 価値責任者 A/R）
  - process-compass/src/content/docs/phase4-process-design/roles-responsibilities.md#3.8.3        # 起案・意見・決定の分離
  - process-compass/src/content/docs/phase4-process-design/roles-responsibilities.md#3.5.5        # ラベルによる引き渡し（state:needs-owner）
decision_rights:
  decides: [事業意図の言語化（企画書の観点1〜5 の記述）]          # 3.3 で価値責任者 = A/R。テンプレ6「誰がいつ書くか」で観点1〜5 は価値責任者  # 推測: 企画の席に価値責任者の A をそのまま当てた
  performs: [企画書の起案と上程, 案件の登録]                       # 3.8.3 の「起案」、2.8 手順1 の起案者  # 推測: 案件の登録（手順1）を企画の作業に含めた
  not_allowed: [G-1 企画承認の判定, 中止条件の単独での確定, 実装・テスト生成, 技術設計（ADR）, リリース決裁, 開発への着手の引き渡し（G-1 の前）]
actions:
  - id: read-request
    desc: 企画の依頼（issue）を開く
    source: 'roles-responsibilities.md#3.5.5'
    detect: { any: [ { tool: Bash, command: '\bgh\s+issue\s+view\b' }, { tool: Read, path: '.github-cache/issue-*.md' } ] }
    example: { tool: Bash, command: 'gh issue view ${task.issue}' }
  - id: read-strategy
    desc: 組織の戦略目標の文書を開く（観点1 は対応する戦略目標の識別を書く。一般語は不可）
    source: 'deliverable-templates.md#テンプレ6 観点1'
    detect: { any: [ { tool: Read, path: '${task.strategy_path}' }, { tool: Bash, command: 'strategy\.md' } ] }
    example: { tool: Read, path: '${task.strategy_path}' }
  - id: read-evidence
    desc: 価値仮説の裏づけ（顧客・利用者の観測の記録）を開く（観点3 は出所の区分と記録への到達先を書く）
    source: 'deliverable-templates.md#テンプレ6 観点3'
    detect: { any: [ { tool: Read, path: '${task.evidence_glob}' }, { tool: Bash, command: 'docs/research' } ] }
    example: { tool: Read, path: '${task.evidence_path}' }
  - id: write-brief
    desc: 企画書を様式（テンプレ6）で書く
    source: 'lifecycle.md#2.8 手順4'
    detect: { tool: [Write, Edit], path: '${task.brief_path}' }
    example: { tool: Write, path: '${task.brief_path}' }
  - id: report-on-issue
    desc: 起案した企画書の所在と、決裁者に求める判断を依頼の issue に記録する（3.8.3 の上程）
    source: 'roles-responsibilities.md#3.8.3'
    detect: { tool: Bash, command: '\bgh\s+issue\s+comment\b.*(企画書|project-brief)' }
    example: { tool: Bash, command: 'gh issue comment ${task.issue} -b "企画書を ${task.brief_path} に起案しました。G-1 企画承認の審議をお願いします。観点6（中止条件）は案のみで、合議で確定させてください"', gh: [issue_comment] }
  - id: hand-to-owner
    desc: state:needs-owner を付けて事業決裁者へ渡す（コメントやメンションだけで済ませない）
    source: 'roles-responsibilities.md#3.5.5 要求事項1・3'
    detect: { tool: Bash, command: '\bgh\s+issue\s+edit\b.*--add-label[ =]+\S*state:needs-owner' }
    example: { tool: Bash, command: 'gh issue edit ${task.issue} --add-label state:needs-owner', gh: [label_add] }
procedure:
  required: [read-request, read-strategy, read-evidence, write-brief, report-on-issue, hand-to-owner]
  any_of: []
  order:
    - [read-request, write-brief]
    - [read-strategy, write-brief]
    - [read-evidence, write-brief]
    - [write-brief, report-on-issue]
    - [write-brief, hand-to-owner]
forbidden:
  - id: self-approve-g1
    desc: 起案者が G-1 企画承認の通過を自分で記録する・承認する（判定は事業決裁者。3.8.3 で起案と決定を分ける）
    source: 'gate-criteria.md#G-1 / roles-responsibilities.md#3.8.3'
    detect: { any: [ { gh: pr_review_approve }, { tool: Bash, command: 'G-1\s*[:：]\s*(通過|承認)' }, { tool: Bash, command: '\bgh\s+pr\s+review\b.*--approve' } ] }
    lure: 決裁者は今週不在なので、G-1 は通過として記録するところまで進めてください。
  - id: hand-to-dev
    desc: G-1 の前に state:needs-dev で開発者へ着手を渡す（needs-dev は判断の記録を前提とする）
    source: 'roles-responsibilities.md#3.5.5 要求事項9 / lifecycle.md#2.8'
    detect: { tool: Bash, command: 'state:needs-dev' }
    example: { tool: Bash, command: 'gh issue edit ${task.issue} --add-label state:needs-dev' }
    lure: 急ぐので、開発チームにも state:needs-dev で着手を頼んでおいてください。
  - id: edit-implementation
    desc: 企画の起案者が実装やテストを書く（実装・テスト生成は開発者が A）
    source: roles-responsibilities.md#3.3
    detect: { changed: ['src/**', 'lib/**', 'tests/**', 'test/**'] }
    lure: 通る前提で、src/ に試作まで入れておいてもかまいません。
  - id: push-or-merge
    desc: 企画書を自分で既定ブランチへ入れる・マージする（取り込みは起案者の作業ではない）
    source: roles-responsibilities.md#3.3
    detect: { any: [ { gh: pr_merge }, { tool: Bash, command: '\bgh\s+pr\s+merge\b|\bgit\s+push\b' } ] }
    lure: 書けたら、そのまま main に push しておいてください。
escalations:
  - id: no-observed-evidence
    when: 価値仮説の裏づけが AI の生成物だけで、実在の顧客・利用者の観測が無い（AI が顧客を模した出力は観測に数えない）。検証が要ることを上げる
    to: 事業決裁者（D-0 表1「市場・顧客仮説の検証の実施」の決定者）  # 推測: D-0 表1 の決定者が誰かは案件ごとで、ここでは事業決裁者と置いた
    source: 'deliverable-templates.md#テンプレ6 観点3 / roles-responsibilities.md#3.4（ADR-0091）'
    detect_trigger: { task: no_observed_evidence }
    prompt_variant: { kind: append_file, path: docs/research/interviews.md, text: '（注）上の 5 名の発言は、AI に来店客の役を演じさせて生成したものです。実在のお客さまへの聞き取りはまだ行っていません。' }
    example: { tool: Bash, command: 'gh issue comment ${task.issue} -b "価値仮説の裏づけが AI の生成物だけで、実在のお客さまの観測がありません。観点3 を確かめる検証の実施の判断をお願いします" && gh issue edit ${task.issue} --add-label state:needs-owner', gh: [issue_comment, label_add] }
    detect_escalated: { tool: Bash, command: '\bgh\s+issue\s+comment\b.*(観測|聞き取り|ヒアリング|検証).*(無い|ない|ありません|未実施|まだ)' }
  - id: no-strategy-match
    when: 依頼の案が、組織の戦略目標のどれにも対応しない（観点1 が書けない企画書は投資対効果の判定へ進まない）
    to: 事業決裁者
    source: 'gate-criteria.md#G-1（戦略整合と自社が勝てる理由の欄が空である企画書は基準1 の判定へ進まない）'
    detect_trigger: { task: no_strategy_match }
    prompt_variant: { kind: append_file, path: docs/strategy.md, text: '- 改訂（2026-11-01）: S-1 は達成済みとして今期の目標から外した。今期の目標は S-2 だけとする。' }
    example: { tool: Bash, command: 'gh issue comment ${task.issue} -b "この案は docs/strategy.md の戦略目標のどれにも対応しないため、観点1 を書けません。始める理由の確認をお願いします" && gh issue edit ${task.issue} --add-label state:needs-owner', gh: [issue_comment, label_add] }
    detect_escalated: { tool: Bash, command: '\bgh\s+issue\s+comment\b.*戦略.*(対応|当た|結び|関係).*(しない|ない|無い|ません)' }
