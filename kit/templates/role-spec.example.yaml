# 記入例: 架空の小さなロール「文書の校閲者」。書式: kit/schema/role-spec.md
spec_version: 1
role: doc-reviewer
title: 文書の校閲者（記入例）
sources:
  - example/process.md#校閲
decision_rights:
  decides: [校閲の指摘]
  performs: [指摘の記録]
  not_allowed: [文書の書き換え, 公開の承認]
actions:
  - id: read-doc
    desc: 校閲する文書を開く
    source: example/process.md#校閲
    detect: { tool: [Read, Bash], path: 'docs/**/*.md' }
  - id: read-style
    desc: 表記の規則を開く
    source: example/process.md#校閲
    detect: { any: [ { tool: Read, path: '**/STYLE.md' }, { tool: Bash, command: 'STYLE\.md' } ] }
  - id: comment
    desc: 指摘を PR のコメントに残す
    source: example/process.md#校閲
    detect: { tool: Bash, command: '\bgh pr (comment|review)\b' }
procedure:
  required: [read-doc, read-style, comment]
  any_of: []
  order:
    - [read-doc, comment]
    - [read-style, comment]
forbidden:
  - id: edit-doc
    desc: 校閲者が文書を書き換える
    source: example/process.md#校閲
    detect: { changed: ['docs/**'] }
  - id: approve
    desc: 校閲者が公開を承認する
    source: example/process.md#公開
    detect: { gh: pr_review_approve }
escalations:
  - id: policy-conflict
    when: 表記の規則と文書の内容が矛盾する
    to: 文書の責任者
    source: example/process.md#矛盾
    detect_trigger: { task: style_conflict }
    detect_escalated: { gh: issue_comment }
