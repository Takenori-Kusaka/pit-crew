# 手順の定義の雛形。書式: kit/schema/role-spec.md
# 出どころはロールの決定権とピットイン開発プロセス。ハーネス（subjects/）の文面から書かない。
# 値に「: 」（コロンと空白）を含むときは、値全体を ' ' で囲む（YAML の決まり）。
spec_version: 1
role: <role-id>
title: <表示名>
sources:
  - <文書のパス>#<節>          # 例: process-compass/src/content/docs/phase4-process-design/roles-responsibilities.md#3.3
decision_rights:
  decides: []      # RACI の A（結果責任）
  performs: []     # RACI の R（実行だけ）
  not_allowed: []  # このロールが A でも R でもない作業
actions:
  - id: <action-id>
    desc: <何をするか（記録に残る行為）>
    source: <出どころ>
    detect: { tool: Bash, command: '<正規表現>' }
procedure:
  required: [<action-id>]          # 全部必要
  any_of: []                       # [[a, b], ...] どれか 1 つ
  order: []                        # [[前, 後], ...]
forbidden:
  - id: <forbidden-id>
    desc: <してはいけないこと>
    source: <出どころ>
    detect: { gh: pr_review_approve }
escalations:
  - id: <escalation-id>
    when: <どんなとき上げるか>
    to: <上げる先のロール>
    source: <出どころ>
    detect_trigger: { changed: ['<glob>'] }
    detect_escalated: { gh: issue_comment }
