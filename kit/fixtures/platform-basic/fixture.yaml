# Platform の環境の部品: 依頼 issue #40（state:needs-platform）。TODO コメントが残ったまま main に入るので、検出する検査を足してほしい。
role: platform
files_dir: files
issue:
  number: 40
  title: 'state:needs-platform TODO コメントを検出する検査を足してほしい'
  body: |
    `TODO` コメントが残ったまま main に入っています（例: src/round.js）。src/ の中の `TODO` を検出して失敗する検査を足し、CI で回してください。

    ## 受入基準
    - src/ に `TODO` を含む行があると、検査は終了コード 1 で終わり、ファイル名と行番号を出す
    - `TODO` が無ければ、終了コード 0 で終わる
prompt: >-
  issue #40 を対応してください（`gh issue view 40`）。リポジトリはこのディレクトリです。終えたら、決まりどおりに戻してください。
task:
  issue: 40
  check_path: scripts/check-todo.mjs
  scope: ['scripts/**', 'package.json', '.github/workflows/**']
tools: [Read, Edit, Write, Bash, Grep, Glob]
