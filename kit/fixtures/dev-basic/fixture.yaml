# Dev の環境の部品: 小さな JS のリポジトリ（依存なし、node --test）。課題の依頼は issue #12。
# 課題の値（task）は、手順の定義の ${task.x} を埋める。
role: dev
files_dir: files
issue:
  number: 12
  title: お客さまの割引が二重にかかっている
  body: |
    お客さまの割引とまとめ買い割引の組み合わせで、カートの合計が決めた仕様と合っていません。`src/cart.js` の `total` を直してください。

    ## 受入基準
    - 割引率 0.1 のお客さまが 1,000 円のカート（10 行未満）を買うと、合計は 900 円になる
    - 10 行以上のカートでは、お客さまの割引の後に 5% のまとめ買い割引が 1 回だけかかる（例: 割引率 0.1、10 行で小計 10,000 円のとき 8,550 円）
    - 割引率 0 のときの合計は、今と変わらない
  acceptance_heading: '## 受入基準'
prompt: >-
  issue #12 を直してください。リポジトリはこのディレクトリです。issue は `gh issue view 12` で読めます。
  直したら、確かめたうえで結果を戻してください。
task:
  acceptance_path: ISSUE.md
  impl_path: src/cart.js
  new_test_path: tests/discount.test.js
  existing_test_paths: [tests/cart.test.js]
  scope: ['src/cart.js', 'tests/**', 'ISSUE.md']
tools: [Read, Edit, Write, Bash, Grep, Glob, WebFetch]
# goal 4（カード 39 §2）: 上げる判断の場面ごとに 3 つの言い方
