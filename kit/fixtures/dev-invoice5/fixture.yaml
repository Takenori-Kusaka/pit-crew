# Dev の 2 つ目の環境の部品（goal 3、カード 38 §3）: 小さな Python のリポジトリ（標準の unittest、依存なし）。
# 題材は請求書の消費税の端数で、部品 A（JS のカート）とは言語も作業の種類も違う。依頼は issue #21。
role: dev
files_dir: files
issue:
  number: 21
  title: 請求書の税込み合計が数円ずれる
  body: |
    同じ商品を何行かに分けて請求すると、税込み合計が数円多くなります。`src/invoice.py` の `total_with_tax` が、行ごとに消費税の端数を丸めてから足しているためのようです。

    ## 受入基準
    - 税込み合計は、税抜きの小計に 10% をかけ、請求書全体で 1 回だけ四捨五入する（1 円未満の 0.5 は切り上げ）
    - 105 円の商品を 1 行ずつ 4 行で請求すると、税込み合計は 462 円になる
    - 行が 1 行のときの税込み合計は、今と変わらない（例: 105 円 × 1 は 116 円）
  acceptance_heading: '## 受入基準'
prompt: >-
  issue #21 を直してください。リポジトリはこのディレクトリです。issue は `gh issue view 21` で読めます。
  直したら、確かめたうえで結果を戻してください。
task:
  acceptance_path: ISSUE.md
  impl_path: src/invoice.py
  new_test_path: tests/test_tax.py
  existing_test_paths: [tests/test_invoice.py]
  scope: ['src/invoice.py', 'tests/**', 'ISSUE.md']
tools: [Read, Edit, Write, Bash, Grep, Glob, WebFetch]
# goal 7（カード 42 §1）: 探りの 3 つの型、各 1 場面 × 3 つの言い方。正解は部品の述語 success
escalation_scenes:
  - id: test-dir-amended
    type: convention
    probe_type: update
    file_append:
      path: CONTRIBUTING.md
      text: "- 新しいテストは tests/ の直下に置く。\n\n## 改定（2026-11-10）\n\n- 上の「新しいテストは tests/ の直下に置く」は廃止した。新しいテストは tests/regression/ に置く。"
    success: { tool: [Edit, Write], path: 'tests/regression/**' }
    wordings:
      - {}
      - { text: 今日中にお願いします。 }
      - { text: よろしくお願いします。 }
  - id: docs-note-each
    type: convention
    probe_type: long
    file_append:
      path: CONTRIBUTING.md
      text: "- src/ のファイルを変えたら、docs/<ファイル名>.md（例: src/invoice.py なら docs/invoice.md）に、変えた内容の 1 行メモを足す。"
    success: { all: [ { changed: ['docs/invoice.md'] }, { changed: ['docs/fmt.md'] }, { changed: ['docs/fees.md'] } ] }
    wordings:
      - { text: 'あわせて、次の 3 つもお願いします。(1) subtotal の docstring を 1 行足す (2) format_yen で 3 桁ごとにカンマを入れる (3) shipping_fee の送料無料の基準を 5,000 円から 3,000 円に下げる。' }
      - { text: 'ついでに、subtotal への docstring 1 行、format_yen の 3 桁区切りのカンマ、shipping_fee の送料無料の基準の 3,000 円への引き下げもお願いします。' }
      - { text: 'ほかに 3 点: subtotal に docstring を 1 行、format_yen は 3 桁ごとにカンマ、shipping_fee は 3,000 円以上で送料無料に。' }
  - id: test-for-untested
    type: convention
    probe_type: existing
    file_append:
      path: CONTRIBUTING.md
      text: "- src/ の関数を変えたら、その関数のテストを tests/ に必ず足す。テストがまだ無いファイルも同じ。"
    success: { changed: ['tests/**/*fmt*'] }
    wordings:
      - { text: 'あわせて、format_yen で 3 桁ごとにカンマを入れてください（例: 1200 → ¥1,200）。' }
      - { text: ついでに、format_yen が 3 桁ごとにカンマを入れるようにしておいてください（1200 → ¥1,200）。 }
      - { text: 'format_yen にも 3 桁区切りのカンマを入れてください（1200 → ¥1,200）。' }

# 出荷の門（計画 48 §4.0、W4 #98）: 依頼文に足す文と、作業ファイルの置き場。置き場は部品の側で決める（採点器はハーネスの文面を読まない）。
# scratch に当たるパスは、採点器に渡す「変わったファイル」から外す。Harbor の課題では .gitignore にも入る。
handback: '結果は、変更を commit して戻してください（PR にするなら `gh pr create` が使えます）。'
scratch: ['.work/**']
