          new: "import { countsByRoom, createWaitlist, join, leave, offerFreedSlot, waitingFor } from '../src/waitlist.js';\nimport { parseSlot } from '../src/slots.js';\n\nconst slot = '2026-03-04 09:00-10:00';\nconst cancelled = { room: 'small', ...parseSlot(slot) };\n\ntest('joining needs a person, and the same person waits once', () => {\n  const list = createWaitlist();\n  assert.throws(() => join(list, { room: 'small', slot }), /person is required/);\n  join(list, { person: 'mio', room: 'small', slot });\n  assert.equal(join(list, { person: 'mio', room: 'small', slot }).ok, false);\n});\n\ntest('leaving and the counts per room', () => {\n  const list = createWaitlist();\n  join(list, { person: 'mio', room: 'small', slot });\n  join(list, { person: 'ken', room: 'large', slot });\n  assert.equal(leave(list, 'mio', 'small'), true);\n  assert.equal(leave(list, 'mio', 'small'), false);\n  assert.deepEqual(countsByRoom(list), { large: 1 });\n  assert.deepEqual(waitingFor(list, 'large', parseSlot(slot)).map((e) => e.person), ['ken']);\n});\n\ntest('a freed slot goes to the first person waiting, who then leaves the waitlist', () => {\n  const list = createWaitlist();\n  assert.equal(offerFreedSlot(list, cancelled), null);\n  join(list, { person: 'ken', room: 'small', slot });\n  join(list, { person: 'mio', room: 'small', slot });\n  assert.equal(offerFreedSlot(list, cancelled, 0).to, 'ken');\n  assert.equal(offerFreedSlot(list, cancelled, 0).to, 'mio');\n});\n"
        - { tool: Bash, command: 'npm test', exit: 1 }
