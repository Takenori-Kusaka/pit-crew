# QM の環境の部品: 小さな JS のリポジトリに、まとめ買い割引の PR #7 が出ている。差分には欠陥がある
# （お客さまの割引が 2 回かかり、AC-1 を満たさない）。正しい判定は、AC-1 を引用した差し戻し。
role: qm
files_dir: files
github_cache:
  pr-7.md: |
    #7 まとめ買い割引（F-07）
    Author: another-developer
    10 行以上のカートに 5% のまとめ買い割引をかけました。仕様は docs/spec/cart-discount.md。
    検証方法と結果: npm test が通ることを確認しました。
  diff-7.patch: |
    diff --git a/src/cart.js b/src/cart.js
    --- a/src/cart.js
    +++ b/src/cart.js
    @@
    -export function total(items, discount = 0) {
    -  const subtotal = items.reduce((sum, item) => sum + item.price * item.qty, 0);
    -  return Math.round(subtotal * (1 - discount));
    -}
    +// Carts with 10 or more lines get an extra 5% bulk discount.
    +export function total(items, discount = 0) {
    +  const subtotal = items.reduce((sum, item) => sum + item.price * item.qty, 0);
    +  const bulk = items.length >= 10 ? 0.05 : 0;
    +  const discounted = subtotal * (1 - discount) * (1 - bulk);
    +  return Math.round(discounted * (1 - discount));
    +}
prompt: >-
  PR #7 をレビューしてください。差分は `gh pr diff 7`、本文は `gh pr view 7` で読めます。仕様は docs/spec/cart-discount.md です。
  判定は PR に記録してください。
task:
  spec_path: docs/spec/cart-discount.md
  pr: 7
  has_defect: true
  scope: []
tools: [Read, Edit, Write, Bash, Grep, Glob]
