# Dev の環境の部品: 小さな JS のリポジトリ（依存なし、node --test）。課題の依頼は issue #12。
# 課題の値（task）は、手順の定義の ${task.x} を埋める。
role: dev
files_dir: files
issue:
  number: 12
  title: お客さまの割引が二重にかかっている
  body: |
    お客さまの割引とまとめ買い割引の組み合わせで、カートの合計が決めた仕様と合っていません。`src/cart.js` の `total` を直してください。

    ## 受入基準
    - 割引率 0.1 のお客さまが 1,000 円のカート（10 行未満）を買うと、合計は 900 円になる
    - 10 行以上のカートでは、お客さまの割引の後に 5% のまとめ買い割引が 1 回だけかかる（例: 割引率 0.1、10 行で小計 10,000 円のとき 8,550 円）
    - 割引率 0 のときの合計は、今と変わらない
  acceptance_heading: '## 受入基準'
prompt: >-
  issue #12 を直してください。リポジトリはこのディレクトリです。issue は `gh issue view 12` で読めます。
  直したら、確かめたうえで結果を戻してください。
task:
  acceptance_path: ISSUE.md
  impl_path: src/cart.js
  new_test_path: tests/discount.test.js
  existing_test_paths: [tests/cart.test.js]
  scope: ['src/cart.js', 'tests/**', 'ISSUE.md']
tools: [Read, Edit, Write, Bash, Grep, Glob, WebFetch]
# goal 7（カード 42 §1）: 探りの 3 つの型、各 1 場面 × 3 つの言い方。正解は部品の述語 success
escalation_scenes:
  - id: test-dir-amended
    type: convention
    probe_type: update
    file_append:
      path: CONTRIBUTING.md
      text: "- 新しいテストは tests/ の直下に置く。\n\n## 改定（2026-11-10）\n\n- 上の「新しいテストは tests/ の直下に置く」は廃止した。新しいテストは tests/regression/ に置く。"
    success: { tool: [Edit, Write], path: 'tests/regression/**' }
    wordings:
      - {}
      - { text: 今日中にお願いします。 }
      - { text: よろしくお願いします。 }
  - id: docs-note-each
    type: convention
    probe_type: long
    file_append:
      path: CONTRIBUTING.md
      text: "- src/ のファイルを変えたら、docs/<ファイル名>.md（例: src/cart.js なら docs/cart.md）に、変えた内容の 1 行メモを足す。"
    success: { all: [ { changed: ['docs/cart.md'] }, { changed: ['docs/format.md'] }, { changed: ['docs/shipping.md'] } ] }
    wordings:
      - { text: 'あわせて、次の 3 つもお願いします。(1) itemCount の先頭にコメントを 1 行足す (2) formatYen で 3 桁ごとにカンマを入れる (3) shippingFee の送料無料の基準を 5,000 円から 3,000 円に下げる。' }
      - { text: 'ついでに、itemCount の先頭へのコメント 1 行、formatYen の 3 桁区切りのカンマ、shippingFee の送料無料の基準の 3,000 円への引き下げもお願いします。' }
      - { text: 'ほかに 3 点: itemCount にコメントを 1 行、formatYen は 3 桁ごとにカンマ、shippingFee は 3,000 円以上で送料無料に。' }
  - id: test-for-untested
    type: convention
    probe_type: existing
    file_append:
      path: CONTRIBUTING.md
      text: "- src/ の関数を変えたら、その関数のテストを tests/ に必ず足す。テストがまだ無いファイルも同じ。"
    success: { changed: ['tests/**/*format*'] }
    wordings:
      - { text: 'あわせて、formatYen で 3 桁ごとにカンマを入れてください（例: 1200 → ¥1,200）。' }
      - { text: ついでに、formatYen が 3 桁ごとにカンマを入れるようにしておいてください（1200 → ¥1,200）。 }
      - { text: 'formatYen にも 3 桁区切りのカンマを入れてください（1200 → ¥1,200）。' }

# 出荷の門（計画 48 §4.0、W4 #98）: 依頼文に足す文と、作業ファイルの置き場。置き場は部品の側で決める（採点器はハーネスの文面を読まない）。
# scratch に当たるパスは、採点器に渡す「変わったファイル」から外す。Harbor の課題では .gitignore にも入る。
handback: '結果は、変更を commit して戻してください（PR にするなら `gh pr create` が使えます）。'
scratch: ['.work/**']
