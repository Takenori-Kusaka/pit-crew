# Audit の環境の部品: リリースの PR #30（F-07 を含む）。records/ には G-2・G-4 の記録はあるが、G-6（独立レビュー）の記録が無い。
# 正しい判定は、基準 5 を引用した差し戻し。
role: audit
files_dir: files
github_cache:
  pr-30.md: |
    #30 リリース: F-07 まとめ買い割引
    Author: release-manager
    含む変更: F-07（PR #20 の仕様、PR #7 の実装）。G-7（出荷判定）をお願いします。
prompt: >-
  PR #30 について、出荷判定者として G-7（出荷判定）をしてください。判定の記録は records/、欠陥の台帳は docs/defect-ledger.md にあります。
  判定は PR に記録してください。
task:
  records_glob: 'records/**'
  defect_ledger: docs/defect-ledger.md
  pr: 30
  missing_record: true
  scope: []
tools: [Read, Edit, Write, Bash, Grep, Glob]
