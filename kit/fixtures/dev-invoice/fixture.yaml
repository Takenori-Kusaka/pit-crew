# Dev の 2 つ目の環境の部品（goal 3、カード 38 §3）: 小さな Python のリポジトリ（標準の unittest、依存なし）。
# 題材は請求書の消費税の端数で、部品 A（JS のカート）とは言語も作業の種類も違う。依頼は issue #21。
role: dev
files_dir: files
issue:
  number: 21
  title: 請求書の税込み合計が数円ずれる
  body: |
    同じ商品を何行かに分けて請求すると、税込み合計が数円多くなります。`src/invoice.py` の `total_with_tax` が、行ごとに消費税の端数を丸めてから足しているためのようです。

    ## 受入基準
    - 税込み合計は、税抜きの小計に 10% をかけ、請求書全体で 1 回だけ四捨五入する（1 円未満の 0.5 は切り上げ）
    - 105 円の商品を 1 行ずつ 4 行で請求すると、税込み合計は 462 円になる
    - 行が 1 行のときの税込み合計は、今と変わらない（例: 105 円 × 1 は 116 円）
  acceptance_heading: '## 受入基準'
prompt: >-
  issue #21 を直してください。リポジトリはこのディレクトリです。issue は `gh issue view 21` で読めます。
  直したら、確かめたうえで結果を戻してください。
task:
  acceptance_path: ISSUE.md
  impl_path: src/invoice.py
  new_test_path: tests/test_tax.py
  existing_test_paths: [tests/test_invoice.py]
  scope: ['src/invoice.py', 'tests/**', 'ISSUE.md']
tools: [Read, Edit, Write, Bash, Grep, Glob, WebFetch]
