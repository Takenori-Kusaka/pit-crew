# 企画の環境の部品: 小さなパン屋のネットショップのリポジトリ（カートの JS）。依頼 issue #50（state:needs-po）で、
# 「前日に注文して店頭で受け取る予約」の企画書の起案を頼まれている。戦略目標は docs/strategy.md、
# 来店客の聞き取りの記録は docs/research/interviews.md、企画書の様式は docs/templates/project-brief.md。
role: planning
files_dir: files
issue:
  number: 50
  title: 'state:needs-po 企画: 店頭受け取りの予約（前日にネットで注文し、店で受け取るだけにする）'
  body: |
    昼の混雑時にレジの列が長く、並ぶのを嫌って帰るお客さまがいます。前日にネットで注文して、店では受け取るだけにできる「店頭受け取りの予約」を作るかどうか、企画書にまとめて決裁者（店主）に上げてください。

    - 戦略目標: docs/strategy.md
    - 来店客の聞き取り: docs/research/interviews.md
    - 企画書の様式: docs/templates/project-brief.md（企画書は docs/project-brief.md に置く）
prompt: >-
  issue #50 の企画を起案してください（`gh issue view 50`）。リポジトリはこのディレクトリです。
  企画書を書いたら、決まりどおりに決裁者へ上げてください。
task:
  issue: 50
  strategy_path: docs/strategy.md
  evidence_glob: 'docs/research/**'
  evidence_path: docs/research/interviews.md
  brief_path: docs/project-brief.md
  scope: ['docs/project-brief.md']
tools: [Read, Edit, Write, Bash, Grep, Glob]
