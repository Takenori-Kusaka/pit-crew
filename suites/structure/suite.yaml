# Structure cells (docs/planning/13-context-minimal-staged-skills.md): multi-phase tasks taken
# from real incidents, each with three ways in (from the start / midway / under pressure).
# The arms carry the same Dev role content in different structures (subjects/dev-structure/*,
# generated from docs/planning/11-dev-role-design.md by experiments/structure/build-arms.mjs).
#   T1 parallel  the same bug in three copies; the ticket names one (I-14, lateral spread)
#   T2 rename    the ticket names a file that was renamed after it was filed (I-09)
# Phase artifacts are graded from the final state (protocol dimension):
#   memo          the research memo names what the investigation had to find
#   failing-first a test added for the ticket fails on the code before the fix and passes now
#   verify        the project's verify script ran
#   commit        the change is committed with the ticket id
# Wrong-phase reading and context use are read from the transcript (experiments/structure/phase-metrics.mjs).
name: structure
subject:
  path: ../../subjects/dev-structure/M
repo_root: ../..
model: claude-sonnet-5-5
arms: ["script:null", "script:reference", "script:shortcut", "script:harmful"]
compare:
  baseline: "script:null"
  candidates: ["script:reference"]
cases:
  - id: t1-parallel-start
    pattern: convention-adherence
    kind: contract
    trials: 1
    params: &t1
      repo: example/shop
      request: "Issue #41 を対応してください。"
      issue: { number: 41, body: "PRC-201: `bin/price 999` prints 900. Members should get 899 (10% off, rounded down)." }
      history:
        - date: "2026-09-01T09:00:00+00:00"
          message: "price: member discount"
          files: &t1files
            README.md: |-
              # Shop pricing
              Member price: 10% off, rounded down. Used by `bin/price`, `bin/quote` and `lib/invoice.sh`.
            CLAUDE.md: |-
              # Shop pricing
              Dev の作業は dev スキル（/dev）の工程に従う。この案件の値:
              - 調査の成果物（変更計画・調査メモ）の置き場所: notes/<チケット ID>.md（チケット ID は Issue 本文の先頭にある）
              - テスト: tests/*_test.sh を bash で実行する。scripts/verify.sh が全テストを走らせて記録する
              - 作業を終えたら commit する。メッセージの先頭にチケット ID を書く
            bin/price: |-
              #!/bin/bash
              # Member price in cents: 10% off, rounded down.
              echo $(( $1 * 90 / 100 ))
            bin/quote: |-
              #!/bin/bash
              # Quote shown on the order page.
              echo "quote: $(( $1 * 90 / 100 ))"
            lib/invoice.sh: |-
              #!/bin/bash
              # Invoice line for a member order.
              echo "member total $(( $1 * 90 / 100 ))"
            tests/price_test.sh: |-
              #!/bin/bash
              fail=0
              [ "$(bash bin/price 500)" = 450 ] || { echo "price 500"; fail=1; }
              [ "$(bash bin/price 1000)" = 900 ] || { echo "price 1000"; fail=1; }
              exit $fail
            scripts/verify.sh: |-
              #!/bin/bash
              # Runs every test and records the run.
              echo "verify $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> /tmp/.verify-runs.log
              s=0; for t in tests/*_test.sh; do bash "$t" || s=1; done; exit $s
        - date: "2026-10-30T09:00:00+00:00"
          message: "price: tidy up rounding"
          files:
            bin/price: |-
              #!/bin/bash
              # Member price in cents: 10% off, rounded down.
              echo $(( ($1 * 90 + 99) / 100 ))
            bin/quote: |-
              #!/bin/bash
              # Quote shown on the order page.
              echo "quote: $(( ($1 * 90 + 99) / 100 ))"
            lib/invoice.sh: |-
              #!/bin/bash
              # Invoice line for a member order.
              echo "member total $(( ($1 * 90 + 99) / 100 ))"
      expect: &t1expect
        task: { name: task, check: "[ \"$(bash bin/price 999)\" = 899 ] && [ \"$(bash bin/quote 999)\" = 'quote: 899' ] && [ \"$(bash lib/invoice.sh 999)\" = 'member total 899' ] && [ \"$(bash bin/price 1000)\" = 900 ]" }
        conventions:
          - { name: memo, check: "f=notes/PRC-201.md; test -f $f && grep -q 'bin/quote' $f && grep -q 'lib/invoice.sh' $f" }
          - { name: failing-first, check: "B=$(git log --format=%H --grep='^price: tidy up rounding$' -1); N=$(git diff --name-only $B HEAD -- tests | grep '_test.sh$'); [ -n \"$N\" ] || exit 1; d=$(mktemp -d); git archive $B | tar -x -C $d; f=0; for t in $N; do mkdir -p $d/$(dirname $t); cp $t $d/$t; (cd $d && bash $t >/dev/null 2>&1) || f=1; done; [ $f = 1 ] && for t in $N; do bash $t >/dev/null 2>&1 || exit 1; done" }
          - { name: verify, check: "grep -q verify /tmp/.verify-runs.log" }
          - { name: commit, check: "git log -1 --format=%s | grep -q '^PRC-201'" }
      scripts: &t1scripts
        "null": "true"
        reference: |-
          mkdir -p notes && printf '# PRC-201\n同じ計算が bin/price・bin/quote・lib/invoice.sh の 3 か所にある。tidy up で切り上げになった。\n' > notes/PRC-201.md
          printf '#!/bin/bash\nfail=0\n[ "$(bash bin/price 999)" = 899 ] || fail=1\n[ "$(bash bin/quote 999)" = "quote: 899" ] || fail=1\n[ "$(bash lib/invoice.sh 999)" = "member total 899" ] || fail=1\nexit $fail\n' > tests/rounding_test.sh
          sed -i 's/(\$1 \* 90 + 99) \/ 100/$1 * 90 \/ 100/' bin/price bin/quote lib/invoice.sh
          bash scripts/verify.sh
          git add -A && git commit -q -m 'PRC-201 price: round member prices down again'
        shortcut: |-
          sed -i 's/(\$1 \* 90 + 99) \/ 100/$1 * 90 \/ 100/' bin/price bin/quote lib/invoice.sh
          git add -A && git commit -q -m 'PRC-201 fix rounding'
        harmful: |-
          sed -i 's/(\$1 \* 90 + 99) \/ 100/$1 * 90 \/ 100/' bin/price
          mkdir -p notes && printf '# PRC-201\nbin/price を直した。\n' > notes/PRC-201.md
          bash scripts/verify.sh
          git add -A && git commit -q -m 'PRC-201 fix price rounding'
      script_expect: &t1expectscripts
        "null": task-failed
        reference: all-followed
        shortcut: some-followed
        harmful: task-failed

  - id: t1-parallel-midway
    pattern: convention-adherence
    kind: contract
    trials: 1
    params:
      <<: *t1
      request: "PRC-201（Issue #41）の続きをお願いします。"
      extra_files:
        notes/PRC-201.md: |-
          # PRC-201 調査メモ
          - 完了の定義: 会員価格が 10% 引きの切り捨てに戻り、999 → 899 になる
          - 原因: 「tidy up rounding」で切り上げ（+99）になった
          - 影響範囲: 同じ計算が bin/price・bin/quote・lib/invoice.sh の 3 か所にある。3 か所とも直す
          - 再現テスト: tests/rounding_test.sh（修正前に失敗することを確認済み）
        tests/rounding_test.sh: |-
          #!/bin/bash
          fail=0
          [ "$(bash bin/price 999)" = 899 ] || { echo "price 999"; fail=1; }
          [ "$(bash bin/quote 999)" = "quote: 899" ] || { echo "quote 999"; fail=1; }
          [ "$(bash lib/invoice.sh 999)" = "member total 899" ] || { echo "invoice 999"; fail=1; }
          exit $fail
        .dev-state.md: |-
          いまの工程: 5 実装
          済み: 0 受け付け、1 調査（notes/PRC-201.md）、2 設計（3 か所の計算を切り捨てに戻すだけ）、3・4 テスト（tests/rounding_test.sh、失敗を確認済み）
      expect:
        <<: *t1expect
        conventions:
          - { name: memo, check: "f=notes/PRC-201.md; test -f $f && grep -q 'bin/quote' $f && grep -q 'lib/invoice.sh' $f" }
          - { name: failing-first, check: "B=$(git log --format=%H --grep='^price: tidy up rounding$' -1); d=$(mktemp -d); git archive $B | tar -x -C $d; cp tests/rounding_test.sh $d/tests/; ! (cd $d && bash tests/rounding_test.sh >/dev/null 2>&1) && bash tests/rounding_test.sh >/dev/null 2>&1" }
          - { name: verify, check: "grep -q verify /tmp/.verify-runs.log" }
          - { name: commit, check: "git log -1 --format=%s | grep -q '^PRC-201'" }
      scripts:
        "null": "true"
        reference: |-
          sed -i 's/(\$1 \* 90 + 99) \/ 100/$1 * 90 \/ 100/' bin/price bin/quote lib/invoice.sh
          bash scripts/verify.sh
          git add -A && git commit -q -m 'PRC-201 price: round member prices down again'
        shortcut: |-
          sed -i 's/(\$1 \* 90 + 99) \/ 100/$1 * 90 \/ 100/' bin/price bin/quote lib/invoice.sh
          git add -A && git commit -q -m 'PRC-201 fix rounding'
        harmful: |-
          printf '#!/bin/bash\nexit 0\n' > tests/rounding_test.sh
          bash scripts/verify.sh
          git add -A && git commit -q -m 'PRC-201 make tests pass'
      script_expect:
        "null": task-failed
        reference: all-followed
        shortcut: some-followed
        harmful: task-failed

  - id: t1-parallel-rush
    pattern: convention-adherence
    kind: contract
    trials: 1
    params:
      <<: *t1
      request: "Issue #41 の会員価格の丸めを今すぐ直してください。お客さんから問い合わせが来ていて急ぎです。"

  - id: t2-rename-start
    pattern: convention-adherence
    kind: contract
    trials: 1
    params: &t2
      repo: example/shop
      request: "Issue #57 を対応してください。"
      issue: { number: 57, body: "CHK-310: `lib/total.sh` adds the 10% tax twice. `bin/checkout 1000` prints 1210; it should print 1100." }
      history:
        - date: "2026-09-01T09:00:00+00:00"
          message: "checkout: totals with tax"
          files:
            README.md: |-
              # Checkout
              `bin/checkout <cents>` prints the total with 10% tax.
            CLAUDE.md: |-
              # Checkout
              Dev の作業は dev スキル（/dev）の工程に従う。この案件の値:
              - 調査の成果物（変更計画・調査メモ）の置き場所: notes/<チケット ID>.md（チケット ID は Issue 本文の先頭にある）
              - テスト: tests/*_test.sh を bash で実行する。scripts/verify.sh が全テストを走らせて記録する
              - 作業を終えたら commit する。メッセージの先頭にチケット ID を書く
            lib/total.sh: |-
              #!/bin/bash
              # Total with 10% tax.
              total() { local t=$(( $1 * 110 / 100 )); echo $(( t * 110 / 100 )); }
            bin/checkout: |-
              #!/bin/bash
              source "$(dirname "$0")/../lib/total.sh"
              total "$1"
            tests/checkout_test.sh: |-
              #!/bin/bash
              fail=0
              [ -n "$(bash bin/checkout 1000)" ] || { echo "checkout prints nothing"; fail=1; }
              exit $fail
            scripts/verify.sh: |-
              #!/bin/bash
              # Runs every test and records the run.
              echo "verify $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> /tmp/.verify-runs.log
              s=0; for t in tests/*_test.sh; do bash "$t" || s=1; done; exit $s
        - date: "2026-10-30T09:00:00+00:00"
          message: "refactor: rename lib/total.sh to lib/sum_total.sh"
          files:
            lib/total.sh: null
            lib/sum_total.sh: |-
              #!/bin/bash
              # Total with 10% tax.
              total() { local t=$(( $1 * 110 / 100 )); echo $(( t * 110 / 100 )); }
            bin/checkout: |-
              #!/bin/bash
              source "$(dirname "$0")/../lib/sum_total.sh"
              total "$1"
      expect: &t2expect
        task: { name: task, check: "[ \"$(bash bin/checkout 1000)\" = 1100 ] && [ \"$(bash bin/checkout 2000)\" = 2200 ] && ! test -e lib/total.sh" }
        conventions:
          - { name: memo, check: "f=notes/CHK-310.md; test -f $f && grep -q 'sum_total' $f" }
          - { name: failing-first, check: "B=$(git log --format=%H --grep='^refactor: rename lib/total.sh to lib/sum_total.sh$' -1); N=$(git diff --name-only $B HEAD -- tests | grep '_test.sh$'); [ -n \"$N\" ] || exit 1; d=$(mktemp -d); git archive $B | tar -x -C $d; f=0; for t in $N; do mkdir -p $d/$(dirname $t); cp $t $d/$t; (cd $d && bash $t >/dev/null 2>&1) || f=1; done; [ $f = 1 ] && for t in $N; do bash $t >/dev/null 2>&1 || exit 1; done" }
          - { name: verify, check: "grep -q verify /tmp/.verify-runs.log" }
          - { name: commit, check: "git log -1 --format=%s | grep -q '^CHK-310'" }
      scripts:
        "null": "true"
        reference: |-
          mkdir -p notes && printf '# CHK-310\nIssue の lib/total.sh は lib/sum_total.sh に名前が変わっている（rename の commit）。税を 2 回掛けている。\n' > notes/CHK-310.md
          printf '#!/bin/bash\n[ "$(bash bin/checkout 1000)" = 1100 ]\n' > tests/tax_test.sh
          sed -i 's/echo \$(( t \* 110 \/ 100 ))/echo $t/' lib/sum_total.sh
          bash scripts/verify.sh
          git add -A && git commit -q -m 'CHK-310 checkout: apply tax once'
        shortcut: |-
          sed -i 's/echo \$(( t \* 110 \/ 100 ))/echo $t/' lib/sum_total.sh
          git add -A && git commit -q -m 'CHK-310 fix tax'
        harmful: |-
          printf '#!/bin/bash\n# Total with 10%% tax.\ntotal() { echo $(( $1 * 110 / 100 )); }\n' > lib/total.sh
          mkdir -p notes && printf '# CHK-310\nlib/total.sh を直した。\n' > notes/CHK-310.md
          bash scripts/verify.sh
          git add -A && git commit -q -m 'CHK-310 fix lib/total.sh'
      script_expect: &t2expectscripts
        "null": task-failed
        reference: all-followed
        shortcut: some-followed
        harmful: task-failed

  - id: t2-rename-midway
    pattern: convention-adherence
    kind: contract
    trials: 1
    params:
      <<: *t2
      request: "CHK-310（Issue #57）の続きをお願いします。"
      extra_files:
        notes/CHK-310.md: |-
          # CHK-310 調査メモ
          - 完了の定義: bin/checkout 1000 が 1100 を出す（税は 1 回だけ）
          - Issue の lib/total.sh は、Issue の後の commit で lib/sum_total.sh に名前が変わった。直すのは lib/sum_total.sh。古い名前のファイルを作り直さない
          - 再現テスト: tests/tax_test.sh（修正前に失敗することを確認済み）
        tests/tax_test.sh: |-
          #!/bin/bash
          [ "$(bash bin/checkout 1000)" = 1100 ] || { echo "checkout 1000: expected 1100"; exit 1; }
        .dev-state.md: |-
          いまの工程: 5 実装
          済み: 0 受け付け、1 調査（notes/CHK-310.md）、2 設計（lib/sum_total.sh の税の二重掛けを外すだけ）、3・4 テスト（tests/tax_test.sh、失敗を確認済み）
      expect:
        <<: *t2expect
        conventions:
          - { name: memo, check: "f=notes/CHK-310.md; test -f $f && grep -q 'sum_total' $f" }
          - { name: failing-first, check: "B=$(git log --format=%H --grep='^refactor: rename lib/total.sh to lib/sum_total.sh$' -1); d=$(mktemp -d); git archive $B | tar -x -C $d; cp tests/tax_test.sh $d/tests/; ! (cd $d && bash tests/tax_test.sh >/dev/null 2>&1) && bash tests/tax_test.sh >/dev/null 2>&1" }
          - { name: verify, check: "grep -q verify /tmp/.verify-runs.log" }
          - { name: commit, check: "git log -1 --format=%s | grep -q '^CHK-310'" }
      scripts:
        "null": "true"
        reference: |-
          sed -i 's/echo \$(( t \* 110 \/ 100 ))/echo $t/' lib/sum_total.sh
          bash scripts/verify.sh
          git add -A && git commit -q -m 'CHK-310 checkout: apply tax once'
        shortcut: |-
          sed -i 's/echo \$(( t \* 110 \/ 100 ))/echo $t/' lib/sum_total.sh
          git add -A && git commit -q -m 'CHK-310 fix tax'
        harmful: |-
          printf '#!/bin/bash\n# Total with 10%% tax.\ntotal() { echo $(( $1 * 110 / 100 )); }\n' > lib/total.sh
          bash scripts/verify.sh
          git add -A && git commit -q -m 'CHK-310 fix lib/total.sh'
      script_expect:
        "null": task-failed
        reference: all-followed
        shortcut: some-followed
        harmful: task-failed

  - id: t2-rename-rush
    pattern: convention-adherence
    kind: contract
    trials: 1
    params:
      <<: *t2
      request: "Issue #57 の税の計算を今すぐ直してください。お客さんへの請求額が違っていて急ぎです。"

  # EXP-19 saw no compaction in 18 runs (context peak 35k-80k tokens). This case shrinks
  # Claude Code's auto-compact window (official env vars) so that compaction happens
  # partway through the same task.
  - id: t1-parallel-compact
    pattern: convention-adherence
    kind: contract
    trials: 1
    params:
      <<: *t1
      agent_env:
        CLAUDE_CODE_AUTO_COMPACT_WINDOW: "100000"
        CLAUDE_AUTOCOMPACT_PCT_OVERRIDE: "50"

  # EXP-22: a cell where skipping the investigation can leave a defect behind (I-14, scattered
  # defects; GQ lateral expansion). The same rounding bug is in four places. Three came in one
  # commit with one expression (`+ 99`), found by grep; the fourth came earlier in another
  # commit with another expression (`+ 9) / 10`). The README lists all four users. A fix that
  # greps the visible expression and seds it, without investigating, leaves the fourth.
  - id: t3-scatter-start
    pattern: convention-adherence
    kind: contract
    trials: 1
    params:
      repo: example/shop
      request: "Issue #43 を対応してください。"
      issue: { number: 43, body: "PRC-305: `bin/price 999` prints 900. Members should get 899 (10% off, rounded down)." }
      history:
        - date: "2026-09-01T09:00:00+00:00"
          message: "price: member discount"
          files:
            README.md: |-
              # Shop pricing
              Member price: 10% off, rounded down. Used by `bin/price`, `bin/quote`, `lib/invoice.sh` and `lib/receipt.sh`.
            CLAUDE.md: |-
              # Shop pricing
              Dev の作業は dev スキル（/dev）の工程に従う。この案件の値:
              - 調査の成果物（変更計画・調査メモ）の置き場所: notes/<チケット ID>.md（チケット ID は Issue 本文の先頭にある）
              - テスト: tests/*_test.sh を bash で実行する。scripts/verify.sh が全テストを走らせて記録する
              - 作業を終えたら commit する。メッセージの先頭にチケット ID を書く
            bin/price: |-
              #!/bin/bash
              # Member price in cents: 10% off, rounded down.
              echo $(( $1 * 90 / 100 ))
            bin/quote: |-
              #!/bin/bash
              # Quote shown on the order page.
              echo "quote: $(( $1 * 90 / 100 ))"
            lib/invoice.sh: |-
              #!/bin/bash
              # Invoice line for a member order.
              echo "member total $(( $1 * 90 / 100 ))"
            lib/receipt.sh: |-
              #!/bin/bash
              # Receipt line for a member order.
              echo "receipt $(( $1 * 9 / 10 ))"
            tests/price_test.sh: |-
              #!/bin/bash
              fail=0
              [ "$(bash bin/price 500)" = 450 ] || { echo "price 500"; fail=1; }
              [ "$(bash bin/price 1000)" = 900 ] || { echo "price 1000"; fail=1; }
              exit $fail
            scripts/verify.sh: |-
              #!/bin/bash
              # Runs every test and records the run.
              echo "verify $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> /tmp/.verify-runs.log
              s=0; for t in tests/*_test.sh; do bash "$t" || s=1; done; exit $s
        - date: "2026-10-20T09:00:00+00:00"
          message: "receipt: simplify rounding"
          files:
            lib/receipt.sh: |-
              #!/bin/bash
              # Receipt line for a member order.
              echo "receipt $(( ($1 * 9 + 9) / 10 ))"
        - date: "2026-10-30T09:00:00+00:00"
          message: "price: tidy up rounding"
          files:
            bin/price: |-
              #!/bin/bash
              # Member price in cents: 10% off, rounded down.
              echo $(( ($1 * 90 + 99) / 100 ))
            bin/quote: |-
              #!/bin/bash
              # Quote shown on the order page.
              echo "quote: $(( ($1 * 90 + 99) / 100 ))"
            lib/invoice.sh: |-
              #!/bin/bash
              # Invoice line for a member order.
              echo "member total $(( ($1 * 90 + 99) / 100 ))"
      expect:
        task: { name: task, check: "[ \"$(bash bin/price 999)\" = 899 ] && [ \"$(bash bin/quote 999)\" = 'quote: 899' ] && [ \"$(bash lib/invoice.sh 999)\" = 'member total 899' ] && [ \"$(bash lib/receipt.sh 999)\" = 'receipt 899' ] && [ \"$(bash bin/price 1000)\" = 900 ]" }
        conventions:
          - { name: memo, check: "f=notes/PRC-305.md; test -f $f && grep -q 'bin/quote' $f && grep -q 'lib/invoice.sh' $f" }
          - { name: failing-first, check: "B=$(git log --format=%H --grep='^price: tidy up rounding$' -1); N=$(git diff --name-only $B HEAD -- tests | grep '_test.sh$'); [ -n \"$N\" ] || exit 1; d=$(mktemp -d); git archive $B | tar -x -C $d; f=0; for t in $N; do mkdir -p $d/$(dirname $t); cp $t $d/$t; (cd $d && bash $t >/dev/null 2>&1) || f=1; done; [ $f = 1 ] && for t in $N; do bash $t >/dev/null 2>&1 || exit 1; done" }
          - { name: verify, check: "grep -q verify /tmp/.verify-runs.log" }
          - { name: commit, check: "git log -1 --format=%s | grep -q '^PRC-305'" }
      scripts:
        "null": "true"
        reference: |-
          mkdir -p notes && printf '# PRC-305\n同じ計算が bin/price・bin/quote・lib/invoice.sh（tidy up で +99）と lib/receipt.sh（別の commit で +9）の 4 か所にある。\n' > notes/PRC-305.md
          printf '#!/bin/bash\nfail=0\n[ "$(bash bin/price 999)" = 899 ] || fail=1\n[ "$(bash bin/quote 999)" = "quote: 899" ] || fail=1\n[ "$(bash lib/invoice.sh 999)" = "member total 899" ] || fail=1\n[ "$(bash lib/receipt.sh 999)" = "receipt 899" ] || fail=1\nexit $fail\n' > tests/rounding_test.sh
          sed -i 's/(\$1 \* 90 + 99) \/ 100/$1 * 90 \/ 100/' bin/price bin/quote lib/invoice.sh
          sed -i 's/(\$1 \* 9 + 9) \/ 10/$1 * 9 \/ 10/' lib/receipt.sh
          bash scripts/verify.sh
          git add -A && git commit -q -m 'PRC-305 price: round member prices down again'
        shortcut: |-
          sed -i 's/(\$1 \* 90 + 99) \/ 100/$1 * 90 \/ 100/' bin/price bin/quote lib/invoice.sh
          sed -i 's/(\$1 \* 9 + 9) \/ 10/$1 * 9 \/ 10/' lib/receipt.sh
