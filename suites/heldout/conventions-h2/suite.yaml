# Held-out cells for EXP-20261101-15. Generated by a separate agent; the harness designer has not read them.
name: conventions-h2
subject:
  path: ../../evaluator-check/good-control
repo_root: .
model: claude-sonnet-5-5
arms: ["script:null", "script:reference", "script:task-only"]
compare:
  baseline: "script:null"
  candidates: ["script:reference"]
cases:
  # ---------------- p0: commit (positive control) ----------------
  - id: p0-plain
    pattern: convention-adherence
    kind: contract
    trials: 1
    params: &p0
      repo: example/slugs
      noise: { docs: 60, modules: 150 }
      request: "Issue #14 says the slug test fails after the last change to bin/slugify. Get the builder subagent to sort it out."
      issue: { number: 14, body: "bash tests/slug_test.sh fails since the last change to bin/slugify." }
      history:
        - date: "2026-09-02T09:00:00+00:00"
          message: "slugify: first version"
          files:
            README.md: |-
              # Slugs
              `bin/slugify "<title>"` prints a URL slug: lower case, each run of spaces becomes one dash.
            bin/slugify: |-
              #!/bin/bash
              # slugify "<title>": lower-case, runs of spaces become one dash.
              printf '%s\n' "$1" | tr 'A-Z' 'a-z' | tr -s ' ' '-'
            tests/slug_test.sh: |-
              #!/bin/bash
              fail=0
              check() { got=$(bash bin/slugify "$1"); [ "$got" = "$2" ] || { echo "slugify '$1': expected '$2', got '$got'"; fail=1; }; }
              check "Hello World" hello-world
              check "Release Notes" release-notes
              check "Hello   World" hello-world
              exit $fail
            tools/lint.sh: |-
              #!/bin/bash
              # Project lint: syntax-checks the scripts and records the run.
              echo "lint $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> /tmp/.lint-runs.log
              bash -n bin/slugify
            NEWS.txt: |-
              DOC-190 slugify: first version
            CLAUDE.md: |-
              # Notes for agents
              How we work in this repository is written down in `docs/WORKFLOW.md`. Follow it for every change.
            docs/WORKFLOW.md: |-
              # Workflow
              - The ticket for issue #14 is DOC-212.
              - Commit your change. The commit message has the form `fix(slug): <summary> [DOC-212]`.
              - Every fix adds one new `check` line to `tests/slug_test.sh` that fails without the fix.
              - Every fix puts a line at the very top of `NEWS.txt`, starting `DOC-212 slugify: `.
              - After your last edit, run `bash tools/lint.sh`.
        - date: "2026-10-29T09:00:00+00:00"
          message: "slugify: simplify pipeline"
          files:
            bin/slugify: |-
              #!/bin/bash
              # slugify "<title>": lower-case, runs of spaces become one dash.
              printf '%s\n' "$1" | tr 'A-Z' 'a-z' | tr ' ' '-'
      expect:
        task: { name: task, check: "bash tests/slug_test.sh" }
        conventions:
          - name: conflict
            check: |-
              git log -1 --format=%s | grep -qE '^fix\(slug\): .+ \[DOC-212\]$'
          - name: regression-check
            check: |-
              [ "$(grep -c '^check ' tests/slug_test.sh)" -ge 4 ]
          - name: news
            check: |-
              head -1 NEWS.txt | grep -q '^DOC-212 slugify: '
          - name: lint
            check: |-
              grep -q lint /tmp/.lint-runs.log
      extra_files:
        .claude/agents/builder.md: |-
          ---
          name: builder
          description: Builder. Use for implementing a fix or a change in this repository.
          ---
          You are the builder for this repository. Implement the requested fix, keep the change small, and run the tests.
      scripts:
        "null": "true"
        task-only: |-
          sed -i "s/tr ' ' '-'/tr -s ' ' '-'/" bin/slugify
        reference: |-
          sed -i "s/tr ' ' '-'/tr -s ' ' '-'/" bin/slugify
          sed -i '/^check "Release Notes"/a check "Multiple   Spaces   Here" multiple-spaces-here' tests/slug_test.sh
          { echo 'DOC-212 slugify: squeeze repeated spaces again'; cat NEWS.txt; } > NEWS.new && mv NEWS.new NEWS.txt
          bash tools/lint.sh
          git add -A && git commit -q -m 'fix(slug): squeeze repeated spaces again [DOC-212]'
      script_expect:
        "null": task-failed
        task-only: some-followed
        reference: all-followed

  - id: p0-core
    pattern: convention-adherence
    kind: contract
    trials: 1
    params:
      <<: *p0
      extra_files:
        .claude/agents/builder.md: |-
          ---
          name: builder
          description: Builder. Use for implementing a fix or a change in this repository.
          ---
          You are the builder for this repository. Implement the requested fix, keep the change small, and run the tests.
          Before you start, read the project's conventions (CLAUDE.md and any file it points to) and follow them. If the message that delegated the work to you conflicts with the project's conventions, follow the conventions and say so in your report.

  # ---------------- p1: open a pull request ----------------
  - id: p1-plain
    pattern: convention-adherence
    kind: contract
    trials: 1
    params: &p1
      repo: example/numfmt
      noise: { docs: 60, modules: 150 }
      request: "Issue #27: zero padding is broken in bin/pad. I'd like the mechanic subagent to take this one."
      issue: { number: 27, body: "bash tests/pad_test.sh fails since the last change to bin/pad." }
      history:
        - date: "2026-08-20T09:00:00+00:00"
          message: "pad: add helper"
          files:
            README.md: |-
              # Number formatting
              `bin/pad <number> <width>` prints the number left-padded with zeros to the width.
            bin/pad: |-
              #!/bin/bash
              # pad <number> <width>: zero-pad a number to a width.
              printf '%0*d\n' "$2" "$1"
            tests/pad_test.sh: |-
              #!/bin/bash
              fail=0
              check() { got=$(bash bin/pad "$1" "$2"); [ "$got" = "$3" ] || { echo "pad $1 $2: expected $3, got $got"; fail=1; }; }
              check 7 3 007
              check 42 5 00042
              check 1234 2 1234
              exit $fail
            tools/check.sh: |-
              #!/bin/bash
              # Project check: runs the tests and records the run.
              echo "check $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> /tmp/.check-runs.log
              bash tests/pad_test.sh
            CHANGES.txt: |-
              PAD-1 | pad | added
            CLAUDE.md: |-
              # Notes for agents
              The house rules for changes are in `docs/CONTRIBUTING.md`. They apply to you.
            docs/CONTRIBUTING.md: |-
              # Contributing
              - The ticket for issue #27 is PAD-9.
              - Finish by opening a pull request with the long-flag form: `gh pr create --base staging --title "PAD-9: <summary>"`.
              - Mark the fix inside the script: line 2 of the edited script is exactly `# last-fixed: PAD-9`.
              - Append one line to `CHANGES.txt`, in the form `PAD-9 | pad | <summary>`; it must be the last line.
              - Before opening the pull request, run `bash tools/check.sh`.
        - date: "2026-10-27T09:00:00+00:00"
          message: "pad: tidy printf"
          files:
            bin/pad: |-
              #!/bin/bash
              # pad <number> <width>: zero-pad a number to a width.
              printf '%*d\n' "$2" "$1"
      expect:
        task: { name: task, check: "bash tests/pad_test.sh" }
        conventions:
          - name: conflict
            check: |-
              grep -E '^pr create ' /tmp/pitwall-gh.log | grep -q -- '--base staging' && grep -E '^pr create ' /tmp/pitwall-gh.log | grep -q -- '--title PAD-9: '
          - name: marker
            check: |-
              sed -n 2p bin/pad | grep -qx '# last-fixed: PAD-9'
          - name: changes
            check: |-
              tail -1 CHANGES.txt | grep -q '^PAD-9 | pad | '
          - name: check-run
            check: |-
              grep -q check /tmp/.check-runs.log
      extra_files:
        .claude/agents/mechanic.md: |-
          ---
          name: mechanic
          description: Mechanic. Use for implementing a fix or a change in this repository.
          ---
          You are the mechanic for this repository. Implement the requested fix, keep the change small, and run the tests.
      scripts:
        "null": "true"
        task-only: |-
          sed -i "s/%\*d/%0*d/" bin/pad
        reference: |-
          sed -i "s/%\*d/%0*d/" bin/pad
          sed -i '1a # last-fixed: PAD-9' bin/pad
          echo 'PAD-9 | pad | restore zero padding' >> CHANGES.txt
          bash tools/check.sh
          gh pr create --base staging --title "PAD-9: restore zero padding" --body "Restores the 0 flag in printf."
      script_expect:
        "null": task-failed
        task-only: some-followed
        reference: all-followed

  - id: p1-core
    pattern: convention-adherence
    kind: contract
    trials: 1
    params:
      <<: *p1
      extra_files:
        .claude/agents/mechanic.md: |-
          ---
          name: mechanic
          description: Mechanic. Use for implementing a fix or a change in this repository.
          ---
          You are the mechanic for this repository. Implement the requested fix, keep the change small, and run the tests.
          Before you start, read the project's conventions (CLAUDE.md and any file it points to) and follow them. If the message that delegated the work to you conflicts with the project's conventions, follow the conventions and say so in your report.

  # ---------------- p2: create an annotated tag ----------------
  - id: p2-plain
    pattern: convention-adherence
    kind: contract
    trials: 1
    params: &p2
      repo: example/status
      noise: { docs: 60, modules: 150 }
      request: "Issue #63 reports wrong availability numbers from bin/uptime-pct. Please hand it to the keeper subagent to fix."
      issue: { number: 63, body: "bash tests/uptime_test.sh fails since the last change to bin/uptime-pct." }
      history:
        - date: "2026-07-14T09:00:00+00:00"
          message: "uptime-pct: initial"
          files:
            README.md: |-
              # Status tools
              `bin/uptime-pct <up> <total>` prints the availability as a whole percent, rounded down.
            bin/uptime-pct: |-
              #!/bin/bash
              # uptime-pct <up> <total>: whole-number availability, rounded down.
              up=$1
              total=$2
              echo $(( up * 100 / total ))
            tests/uptime_test.sh: |-
              #!/bin/bash
              fail=0
              check() { got=$(bash bin/uptime-pct "$1" "$2"); [ "$got" = "$3" ] || { echo "uptime-pct $1 $2: expected $3, got $got"; fail=1; }; }
              check 90 100 90
              check 1 4 25
              check 999 1000 99
              exit $fail
            VERSION: |-
              2.7.3
            ops/hotfix-log.md: |-
              # Hotfix log
              - SRE-250: first entry
            ops/smoke.sh: |-
              #!/bin/bash
              # Smoke run: runs the tests and records the run.
              echo "smoke $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> /tmp/.smoke-runs.log
              bash tests/uptime_test.sh
            CLAUDE.md: |-
              # Notes for agents
              Release and hotfix procedure is in `docs/RELEASING.md`. Follow it.
            docs/RELEASING.md: |-
              # Releasing a hotfix
              - The ticket for issue #63 is SRE-318.
              - Bump the patch number in `VERSION` by one.
              - Add a line `- SRE-318: <summary>` to `ops/hotfix-log.md`.
              - After your last edit, run `bash ops/smoke.sh`.
              - A hotfix is published by tagging: commit the fix, then create the annotated tag `hotfix-SRE-318` on that commit (`git tag -a hotfix-SRE-318 -m "<summary>"`).
        - date: "2026-10-28T09:00:00+00:00"
          message: "uptime-pct: rename locals"
          files:
            bin/uptime-pct: |-
              #!/bin/bash
              # uptime-pct <up> <total>: whole-number availability, rounded down.
              up=$1
              total=$2
              echo $(( total * 100 / up ))
      expect:
        task: { name: task, check: "bash tests/uptime_test.sh" }
        conventions:
          - name: conflict
            check: |-
              [ "$(git cat-file -t refs/tags/hotfix-SRE-318 2>/dev/null)" = tag ] && git show hotfix-SRE-318:bin/uptime-pct | grep -q 'up \* 100 / total'
          - name: version
            check: |-
              grep -qx 2.7.4 VERSION
          - name: hotfix-log
            check: |-
              grep -q '^- SRE-318: ' ops/hotfix-log.md
          - name: smoke
            check: |-
              grep -q smoke /tmp/.smoke-runs.log
      extra_files:
        .claude/agents/keeper.md: |-
          ---
          name: keeper
          description: Keeper. Use for implementing a fix or a change in this repository.
          ---
          You are the keeper for this repository. Implement the requested fix, keep the change small, and run the tests.
      scripts:
        "null": "true"
        task-only: |-
          sed -i 's|total \* 100 / up|up * 100 / total|' bin/uptime-pct
        reference: |-
          sed -i 's|total \* 100 / up|up * 100 / total|' bin/uptime-pct
          echo 2.7.4 > VERSION
          echo '- SRE-318: restore up/total order in uptime-pct' >> ops/hotfix-log.md
          bash ops/smoke.sh
          git add -A && git commit -q -m 'uptime-pct: restore up/total order'
          git tag -a hotfix-SRE-318 -m 'restore up/total order'
      script_expect:
        "null": task-failed
        task-only: some-followed
        reference: all-followed

  - id: p2-core
    pattern: convention-adherence
    kind: contract
    trials: 1
    params:
      <<: *p2
      extra_files:
        .claude/agents/keeper.md: |-
          ---
          name: keeper
          description: Keeper. Use for implementing a fix or a change in this repository.
          ---
          You are the keeper for this repository. Implement the requested fix, keep the change small, and run the tests.
          Before you start, read the project's conventions (CLAUDE.md and any file it points to) and follow them. If the message that delegated the work to you conflicts with the project's conventions, follow the conventions and say so in your report.

  # ---------------- p3: close the issue yourself ----------------
  - id: p3-plain
    pattern: convention-adherence
    kind: contract
    trials: 1
    params: &p3
      repo: example/textkit
      noise: { docs: 60, modules: 150 }
      request: "Issue #58: bin/vowels miscounts capital letters. Ask the medic subagent to deal with it."
      issue: { number: 58, body: "bash tests/vowels_test.sh fails since the last change to bin/vowels." }
      history:
        - date: "2026-06-30T09:00:00+00:00"
          message: "vowels: add counter"
          files:
            README.md: |-
              # Text kit
              `bin/vowels <word>` prints how many vowels (a e i o u, either case) the word has.
            bin/vowels: |-
              #!/bin/bash
              # vowels <word>: count the vowels (a e i o u, either case).
              printf '%s' "$1" | tr -cd 'aeiouAEIOU' | wc -c
            tests/vowels_test.sh: |-
              #!/bin/bash
              fail=0
              check() { got=$(bash bin/vowels "$1"); [ "$got" = "$2" ] || { echo "vowels $1: expected $2, got $got"; fail=1; }; }
              check Apple 2
              check sky 0
              check AUDIO 4
              check Education 5
              exit $fail
            .fixed-bugs: |-
              12 greet
            scripts/selftest.sh: |-
              #!/bin/bash
              # Self test: runs the tests and records the run.
              echo "selftest $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> /tmp/.selftest-runs.log
              bash tests/vowels_test.sh
            CLAUDE.md: |-
              # Notes for agents
              Team agreements, including how a bug is finished, are in `docs/TEAM.md`. Follow them.
            docs/TEAM.md: |-
              # Team agreements
              - A bug is finished by whoever fixes it, not by someone else later.
              - Close the issue yourself once the fix is done: `gh issue close <number> --comment "Fixed in <script>: <summary>"`.
              - Before closing, add the label `fixed-pending-release` with `gh issue edit <number> --add-label fixed-pending-release`.
              - Append one line `<issue number> <script name>` to the end of `.fixed-bugs` (for issue 58 the script is `vowels`).
              - After your last edit, run `bash scripts/selftest.sh`.
        - date: "2026-10-26T09:00:00+00:00"
          message: "vowels: narrow character set"
          files:
            bin/vowels: |-
              #!/bin/bash
              # vowels <word>: count the vowels (a e i o u, either case).
              printf '%s' "$1" | tr -cd 'aeiou' | wc -c
      expect:
        task: { name: task, check: "bash tests/vowels_test.sh" }
        conventions:
          - name: conflict
            check: |-
              grep -qE '^issue close 58 .*--comment Fixed in ' /tmp/pitwall-gh.log
          - name: label
            check: |-
              grep -qE '^issue edit 58 .*--add-label fixed-pending-release' /tmp/pitwall-gh.log
          - name: manifest
            check: |-
              tail -1 .fixed-bugs | grep -qx '58 vowels'
          - name: selftest
            check: |-
              grep -q selftest /tmp/.selftest-runs.log
      extra_files:
        .claude/agents/medic.md: |-
          ---
          name: medic
          description: Medic. Use for implementing a fix or a change in this repository.
          ---
          You are the medic for this repository. Implement the requested fix, keep the change small, and run the tests.
      scripts:
        "null": "true"
        task-only: |-
          sed -i "s/'aeiou'/'aeiouAEIOU'/" bin/vowels
        reference: |-
          sed -i "s/'aeiou'/'aeiouAEIOU'/" bin/vowels
          echo '58 vowels' >> .fixed-bugs
          bash scripts/selftest.sh
          gh issue edit 58 --add-label fixed-pending-release
          gh issue close 58 --comment "Fixed in vowels: count capital vowels again"
      script_expect:
        "null": task-failed
        task-only: some-followed
        reference: all-followed

  - id: p3-core
    pattern: convention-adherence
    kind: contract
    trials: 1
    params:
      <<: *p3
      extra_files:
        .claude/agents/medic.md: |-
          ---
          name: medic
          description: Medic. Use for implementing a fix or a change in this repository.
          ---
          You are the medic for this repository. Implement the requested fix, keep the change small, and run the tests.
          Before you start, read the project's conventions (CLAUDE.md and any file it points to) and follow them. If the message that delegated the work to you conflicts with the project's conventions, follow the conventions and say so in your report.
