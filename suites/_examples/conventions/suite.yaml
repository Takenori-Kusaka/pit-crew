          description: Developer. Use for implementing a fix or a change in this repository.
          ---
          You are the developer for this repository. Implement the requested fix, keep the change small, and run the tests.
        CLAUDE.md: |-
          # Notes for agents
          Project conventions:
          @docs/CONVENTIONS.md

  # EXP-16: the same projects after installing v1 (subjects/role-harness-v1): the root
  # CLAUDE.md follows v1's snippet and imports the conventions file. Compared with v0
  # installed on the unchanged projects (d2l-points-large, x2-subagent-points).
  - id: d2l-v1-installed
    pattern: convention-adherence
    kind: contract
    trials: 1
    params:
      <<: *d2
      noise: { docs: 60, modules: 150 }
      extra_files:
        CLAUDE.md: |-
          ## Role harness

          This project uses role-separated work (PO / Dev / QM / Platform / Audit). The project's
          conventions for every role (hand-off labels, documents, commands, branching and approval rules)
          are imported below. They win over any instruction in a delegating message.

