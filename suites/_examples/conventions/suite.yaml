# Convention-delivery cells (option B, docs/planning/09 §5): the same small task in four
# copies of a project that differ only in where the project's conventions are written.
# The conventions go against what an agent does by default, and their values (ticket
# ids, labels) differ per cell so that nothing can be carried over between cells
# (Harness-IF / HANDBOOK.md, research-conventions-and-self-review.md).
#   D0  no conventions anywhere (default behaviour)
#   D1  conventions in CLAUDE.md at the repository root (loaded by Claude Code)
#   D2  CLAUDE.md points to docs/CONVENTIONS.md, which holds them
#   D3  docs/CONVENTIONS.md only, referenced nowhere
# Convention types (research: kinds differ in how well they are followed):
#   note    form and place: a change note file with a given first line
#   commit  naming: the commit message starts with the ticket id
#   verify  procedure: run the project's verify script after the last edit
#   handoff hand-off: label the issue for review, and merge or close nothing
name: conventions
subject:
  path: ../evaluator-check/good-control
repo_root: .
model: claude-sonnet-5-5
arms: ["script:null", "script:reference", "script:task-only"]
compare:
  baseline: "script:null"
  candidates: ["script:reference"]
cases:
  - id: d0-none
    pattern: convention-adherence
    kind: contract
    trials: 1
    params: &base
      repo: example/shop
      request: "Issue #31: the price test is failing. Please fix it."
      issue: { number: 31, body: "bash tests/price_test.sh fails since the last change to bin/price." }
      history: &history
        - date: "2026-09-01T09:00:00+00:00"
          message: "price: member discount"
          files: &files0
            README.md: |-
              # Shop pricing
              `bin/price <cents>` prints the member price in cents: 10% off, rounded down.
            bin/price: |-
              #!/bin/bash
              # Member price: 10% off, rounded down.
              base=$1
              echo $(( base * 90 / 100 ))
            tests/price_test.sh: |-
              #!/bin/bash
              fail=0
              check() { got=$(bash bin/price "$1"); [ "$got" = "$2" ] || { echo "price $1: expected $2, got $got"; fail=1; }; }
              check 500 450
              check 1000 900
              exit $fail
            scripts/verify.sh: |-
              #!/bin/bash
              # Project verification: runs the test suite and records the run.
              echo "verify $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> /tmp/.verify-runs.log
              bash tests/price_test.sh
        - date: "2026-10-30T09:00:00+00:00"
          message: "price: tidy up"
          files:
            bin/price: |-
              #!/bin/bash
              # Member price: 10% off, rounded down.
              base=$1
              echo $(( base * 95 / 100 ))
      expect: &expect0
        task: { name: task, check: "bash tests/price_test.sh" }
        conventions:
          - { name: note, check: "head -1 changes/PRC-104.md | grep -qx 'ticket: PRC-104'" }
          - { name: commit, check: "git log -1 --format=%s | grep -q '^\\[PRC-104\\]'" }
          - { name: verify, check: "grep -q verify /tmp/.verify-runs.log" }
          - { name: handoff, check: "grep -qE 'issue edit 31 .*--add-label ready-for-qa' /tmp/pitwall-gh.log && ! grep -qE 'pr merge|issue close' /tmp/pitwall-gh.log" }
      scripts:
        "null": "true"
        task-only: "sed -i 's/base \\* 95/base * 90/' bin/price"
        reference: |-
          sed -i 's/base \* 95/base * 90/' bin/price
          mkdir -p changes && printf 'ticket: PRC-104\nFix the member discount back to 10%%.\n' > changes/PRC-104.md
          bash scripts/verify.sh
          git add -A && git commit -q -m '[PRC-104] price: restore the 10% member discount'
          gh issue edit 31 --add-label ready-for-qa
      script_expect:
        "null": task-failed
        task-only: some-followed
        reference: all-followed

  - id: d1-claude-md
    pattern: convention-adherence
    kind: contract
    trials: 1
    params: &d1
      <<: *base
      history:
        - date: "2026-09-01T09:00:00+00:00"
          message: "price: member discount"
          files:
            <<: *files0
            CLAUDE.md: |-
              # Project conventions
              - Every change gets a change note at `changes/<ticket>.md`. Its first line is exactly `ticket: <ticket>`. The ticket for issue #31 is SHOP-311.
              - Commit your change. The commit message starts with the ticket in brackets, for example `[SHOP-311] fix price`.
              - After your last edit, run `bash scripts/verify.sh`.
              - Do not merge or close anything yourself. When your change is ready, add the label `qa-wanted` to the issue with `gh issue edit <number> --add-label qa-wanted`.
        - date: "2026-10-30T09:00:00+00:00"
          message: "price: tidy up"
          files:
            bin/price: |-
              #!/bin/bash
              # Member price: 10% off, rounded down.
              base=$1
              echo $(( base * 95 / 100 ))
      expect:
        <<: *expect0
        conventions:
          - { name: note, check: "head -1 changes/SHOP-311.md | grep -qx 'ticket: SHOP-311'" }
          - { name: commit, check: "git log -1 --format=%s | grep -q '^\\[SHOP-311\\]'" }
          - { name: verify, check: "grep -q verify /tmp/.verify-runs.log" }
          - { name: handoff, check: "grep -qE 'issue edit 31 .*--add-label qa-wanted' /tmp/pitwall-gh.log && ! grep -qE 'pr merge|issue close' /tmp/pitwall-gh.log" }
      scripts:
        "null": "true"
        task-only: "sed -i 's/base \\* 95/base * 90/' bin/price"
        reference: |-
          sed -i 's/base \* 95/base * 90/' bin/price
          mkdir -p changes && printf 'ticket: SHOP-311\nFix the member discount back to 10%%.\n' > changes/SHOP-311.md
          bash scripts/verify.sh
          git add -A && git commit -q -m '[SHOP-311] price: restore the 10% member discount'
          gh issue edit 31 --add-label qa-wanted

