  # EXP-17: negative controls. X2 with exactly one element changed, to find what elicits
  # the main session's unconditional "don't commit" in the delegation message.
  # e1 request wording, e2 developer definition, e3 repository size, e4 pointer wording.
  - id: x2-e1-request
