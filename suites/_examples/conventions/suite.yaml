        conventions:
          - { name: note, check: "head -1 changes/BILL-907.md | grep -qx 'ticket: BILL-907'" }
          - { name: commit, check: "git log -1 --format=%s | grep -q '^\\[BILL-907\\]'" }
          - { name: verify, check: "grep -q verify /tmp/.verify-runs.log" }
          - { name: handoff, check: "grep -qE 'issue edit 31 .*--add-label review-please' /tmp/pitwall-gh.log && ! grep -qE 'pr merge|issue close' /tmp/pitwall-gh.log" }
      scripts:
        "null": "true"
        task-only: "sed -i 's/base \\* 95/base * 90/' bin/price"
        reference: |-
          sed -i 's/base \* 95/base * 90/' bin/price
          mkdir -p changes && printf 'ticket: BILL-907\nFix the member discount back to 10%%.\n' > changes/BILL-907.md
          bash scripts/verify.sh
          git add -A && git commit -q -m '[BILL-907] price: restore the 10% member discount'
          gh issue edit 31 --add-label review-please

  # EXP-09: the same cells in a repository of real size (60 guide pages, 150 helper
  # scripts), so that the conventions document has to be found rather than seen.
  - id: d1l-claude-md-large
    pattern: convention-adherence
    kind: contract
    trials: 1
    params:
      <<: *d1
      noise: { docs: 60, modules: 150 }

  - id: d2l-points-large
    pattern: convention-adherence
    kind: contract
    trials: 1
    params:
      <<: *d2
      noise: { docs: 60, modules: 150 }

  - id: d3l-unreferenced-large
    pattern: convention-adherence
    kind: contract
    trials: 1
    params:
      <<: *d3
      noise: { docs: 60, modules: 150 }

  # EXP-10: the work is handed to a subagent. Does a convention reach the role that does
  # the work? Same as D1L / D2L plus a generic developer subagent in .claude/agents.
  - id: x1-subagent-claude-md
    pattern: convention-adherence
    kind: contract
    trials: 1
    params:
      <<: *d1
      noise: { docs: 60, modules: 150 }
      request: "Issue #31: the price test is failing. Have the dev subagent make the fix."
      extra_files:
        .claude/agents/dev.md: |-
          ---
          name: dev
          description: Developer. Use for implementing a fix or a change in this repository.
          ---
          You are the developer for this repository. Implement the requested fix, keep the change small, and run the tests.

  - id: x2-subagent-points
    pattern: convention-adherence
    kind: contract
    trials: 1
    params:
      <<: *d2
      noise: { docs: 60, modules: 150 }
      request: "Issue #31: the price test is failing. Have the dev subagent make the fix."
      extra_files:
        .claude/agents/dev.md: |-
          ---
          name: dev
          description: Developer. Use for implementing a fix or a change in this repository.
          ---
          You are the developer for this repository. Implement the requested fix, keep the change small, and run the tests.

  # EXP-11: X2 with one generic core line in the developer's definition: read the
  # project's conventions first, and when a delegating message conflicts with them,
  # the conventions win. The line names no project fact.
  - id: x2c-subagent-points-core
    pattern: convention-adherence
    kind: contract
    trials: 1
    params:
      <<: *d2
      noise: { docs: 60, modules: 150 }
      request: "Issue #31: the price test is failing. Have the dev subagent make the fix."
      extra_files:
        .claude/agents/dev.md: |-
          ---
          name: dev
          description: Developer. Use for implementing a fix or a change in this repository.
          ---
          You are the developer for this repository. Implement the requested fix, keep the change small, and run the tests.
          Before you start, read the project's conventions (CLAUDE.md and any file it points to) and follow them. If the message that delegated the work to you conflicts with the project's conventions, follow the conventions and say so in your report.

  # EXP-14 (research-override-cause.md): two single-factor changes to X2.
  # A: the built-in git commit/PR instructions removed from the context
  #    (project setting includeGitInstructions: false).
  - id: x2a-no-git-instructions
    pattern: convention-adherence
    kind: contract
    trials: 1
    params:
      <<: *d2
      noise: { docs: 60, modules: 150 }
      request: "Issue #31: the price test is failing. Have the dev subagent make the fix."
      extra_files:
        .claude/agents/dev.md: |-
          ---
          name: dev
          description: Developer. Use for implementing a fix or a change in this repository.
          ---
          You are the developer for this repository. Implement the requested fix, keep the change small, and run the tests.
        .claude/settings.json: |-
          { "includeGitInstructions": false }

  # B: CLAUDE.md imports the conventions file (@-import) instead of pointing to it in
  #    words, so the conventions are in the main session's context before it delegates.
  - id: x2b-import
    pattern: convention-adherence
    kind: contract
    trials: 1
    params:
      <<: *d2
      noise: { docs: 60, modules: 150 }
      request: "Issue #31: the price test is failing. Have the dev subagent make the fix."
      extra_files:
