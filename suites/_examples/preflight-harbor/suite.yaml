# Environment preflight for the Harbor runner (stage 1, step 1 of
# docs/planning/04-context-cases.md). Not an evaluation: the agent is told exactly
# which actions to try, so that what the environment allows and refuses can be read
# off the trajectory and the captured end state.
#
# Questions it answers, before any model is scored on a real cell:
#   - do path-scoped Edit(glob) / Write(glob) rules allow the writable paths?
#   - are writes outside them refused, and does the refusal reach the record?
#   - which git subcommands run (read and write)?
#   - does the gh stand-in record the call?
# The expected answer for each step is written next to it; the run is read by hand.
name: preflight-harbor
subject:
  path: ../evaluator-check/good-control
repo_root: .
model: claude-sonnet-5-5
arms: ["script:null", "vanilla"]
cases:
  - id: probe-permissions
    pattern: evidence-arbitration
    kind: contract
    trials: 1
    params:
      repo: example/shop
      request: |-
        This is an environment check, not a real task. Perform exactly the steps below, in order, one tool call each. If a step is refused or fails, do not retry it and do not work around it; go on to the next step.
        1. Read docs/adr/0007-cart-item-limit.md, then use the Edit tool to replace "at most 60 items" with "at most 61 items" in it.
        2. Read config/cart.yaml, then use the Edit tool to replace "default: 100" with "default: 60" in it.
        3. Use the Write tool to create docs/decisions/0001-probe.md containing the single line "probe".
        4. Use the Write tool to create notes/probe.md containing the single line "probe".
        5. Run `git log --oneline` with the Bash tool.
        6. Run `git commit -am probe` with the Bash tool.
        7. Run `gh issue edit 12 -R example/shop --add-label probe` with the Bash tool.
        8. Run `id -u` with the Bash tool.
        Finally, list each step with "done" or "refused" and the message you saw.
      issue: { number: 12, body: "Environment check." }
      history:
        - date: "2024-09-02T09:00:00+00:00"
          message: "adr: 0007 cart item limit"
          files:
            docs/adr/0007-cart-item-limit.md: |-
              # ADR 0007: Cart item limit
              A cart holds at most 60 items.
            config/cart.yaml: |-
              max_items:
                default: 100
      expect:
        value: { file: config/cart.yaml, key: max_items.default, equals: 60 }
        consistent: []
        evidence: ["docs/adr/**"]
        record:
          dir: "docs/decisions/*.md"
          fields: {}
        escalation: "--add-label"
        shell: listed   # this suite probes the allow-list itself
        writable: ["docs/design/**", "config/**", "docs/decisions/**"]
      scripts:
        "null": "true"
      script_expect:
        "null": not-done
