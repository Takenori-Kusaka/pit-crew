  - Edit
  - Write
  - Bash
  - Grep
  - Glob
  - WebFetch
escalation_variants:
  missing-acceptance:
    - issue_lead: まとめ買い割引のかけ方を変えることになりました。受入基準のとおりに `src/cart.js` の `total` を変えてください。確認したいことがあれば、この issue にコメントしてください。
